      this.gPiano.connect(this.reverb);
      this.pluck = Array.from({ length: 6 }, () => {
        const g2 = new Tone.Gain(0.8).connect(this.gGuitar);
        const p = new Tone.PluckSynth({ attackNoise: 1.4, dampening: 3800, resonance: 0.965 }).connect(g2);
        return { p, g: g2 };
      });
      this.polyFallback = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 5e-3, decay: 0.9, sustain: 0.25, release: 1.6 }
      }).connect(this.gPiano);
      this.bassFallback = new Tone.MonoSynth({
        oscillator: { type: "sawtooth" },
        filter: { Q: 1, type: "lowpass" },
        envelope: { attack: 8e-3, decay: 0.3, sustain: 0.5, release: 0.3 },
        filterEnvelope: { attack: 0.01, decay: 0.2, sustain: 0.3, baseFrequency: 90, octaves: 2.4 }
      }).connect(this.gBass);
      this.fretNoise = new Tone.NoiseSynth({
        noise: { type: "pink" },
        envelope: { attack: 4e-3, decay: 0.09, sustain: 0 }
      }).connect(new Tone.Filter(2600, "bandpass").connect(this.gNoise));
      this.scratch = new Tone.NoiseSynth({
        noise: { type: "white" },
        envelope: { attack: 2e-3, decay: 0.05, sustain: 0 }
      }).connect(new Tone.Filter(1400, "bandpass").connect(this.gNoise));
      this.drumGains = {};
      DRUM_PIECES.forEach((n) => {
        this.drumGains[n] = new Tone.Gain(1).connect(this.gDrum);
      });
      this.kick = new Tone.MembraneSynth({
        pitchDecay: 0.045,
        octaves: 6,
        envelope: { attack: 1e-3, decay: 0.32, sustain: 0, release: 0.1 }
      }).connect(this.gDrum);
      this.snare = new Tone.NoiseSynth({
        noise: { type: "white" },
        envelope: { attack: 1e-3, decay: 0.16, sustain: 0 }
      }).connect(new Tone.Filter(1700, "bandpass").connect(this.gDrum));
      this.hat = new Tone.NoiseSynth({
        noise: { type: "white" },
        envelope: { attack: 1e-3, decay: 0.035, sustain: 0 }
      }).connect(new Tone.Filter(9e3, "highpass").connect(new Tone.Volume(-8).connect(this.gDrum)));
      // 節拍器接在 dest 而不是任何一條樂器匯流排上——它不進混音、不進錄音，
      // 只有你自己聽得到。音量另外留一個把手，練習時常要它比伴奏大聲或小聲。
      this.clickVol = new Tone.Volume(-8).connect(dest);
      this.click = new Tone.Synth({
        oscillator: { type: "sine" },
        envelope: { attack: 1e-3, decay: 0.028, sustain: 0, release: 0.01 }
      }).connect(this.clickVol);
      // 取樣吉他（四段力度）自己的音量匯流排，走原吉他匯流排的殘響與混音
      this.gLayered = new Tone.Volume(-3).connect(this.gGuitar);
      this.tone = "acoustic";
      this.toneSrc = "acoustic";
      this.ready = true;
      report && report({ guitar: "loading", piano: "loading", bass: "loading", drum: "loading" });
      const spec = TONES.acoustic;
      const eq = spec.eq || {};
      const aTop = new Tone.Filter({ type: "highshelf", frequency: eq.topHz || 7000, gain: eq.topDb || 0 }).connect(this.gGuitar);
      const aHarsh = new Tone.Filter({ type: "peaking", frequency: eq.harshHz || 3200, Q: eq.harshQ || 1, gain: eq.harshDb || 0 }).connect(aTop);
      const aVol = new Tone.Volume(spec.gain == null ? 0 : spec.gain).connect(aHarsh);
      const g = await loadAcousticGuitar({ timeout: 6e4, release: spec.release });
      if (g) {
        this.guitar = g.hard.connect(aVol);
        this.guitarSoft = g.soft.connect(aVol);
        this.mode.guitar = "sample";
      }
      report && report({ guitar: g ? "sample" : "synth" });
      this.loadPianoTone(PIANO_DEFAULT).then((p) => {
        report && report({ piano: p ? "sample" : "synth" });
      });
      loadSampler("bass-electric", BASS_URLS).then((b) => {
        if (b) {
          this.bass = b.connect(this.gBass);
          this.mode.bass = "sample";
        }
        report && report({ bass: b ? "sample" : "synth" });
      });
      loadDrumKit().then((kit) => {
        if (kit) {
          this.drums = kit;
          this.mode.drum = "sample";
        }
        report && report({ drum: kit ? "sample" : "synth" });
      });
    }
    /**
     * 單層取樣的吉他音色（相對於 studio 的四段力度）。與鋼琴音色一樣逐一快取，
     * 每個音色接自己的音量節點，校準值寫在 TONES 裡即可。
     */
    async loadGuitarTone(key, report) {
      if (this.guitarTones[key]) return this.guitarTones[key];
      if (this.guitarToneLoading[key]) return this.guitarToneLoading[key];
      const spec = TONES[key];
      if (!spec || spec.src !== "sampled") return null;
      report && report("loading");
      const job = loadSampler("", spec.urls, { bases: spec.bases, timeout: 6e4 }).then((s) => {
        this.guitarToneLoading[key] = null;
        if (!s) {
          report && report("failed");
          return null;
        }
        const g = new Tone.Volume(spec.gain == null ? 0 : spec.gain).connect(this.gGuitar);
        this.guitarTones[key] = s.connect(g);
        report && report("ready");
        return s;
      });
      this.guitarToneLoading[key] = job;
      return job;
    }
    /**
     * 鋼琴音色各自獨立載入並快取，切換時不用重載。每個音色接自己的音量節點，
     * 這樣校準值寫在 PIANO_TONES 裡就好，不必動到 gPiano 與 setVolumes。
     */
    async loadPianoTone(key, report) {
      if (this.pianos[key]) return this.pianos[key];
      if (this.pianoLoading[key]) return this.pianoLoading[key];
      const spec = PIANO_TONES[key] || PIANO_TONES[PIANO_DEFAULT];
      report && report("loading");
      const job = loadSampler("", spec.urls, { bases: spec.bases, release: spec.release }).then((s) => {
        this.pianoLoading[key] = null;
        if (!s) {
          report && report("failed");
          return null;
        }
        const g = new Tone.Volume(spec.gain == null ? 0 : spec.gain).connect(this.gPiano);
        this.pianos[key] = s.connect(g);
        this.mode.piano = "sample";
        report && report("ready");
        return s;
      });
      this.pianoLoading[key] = job;
      return job;
    }
    setPianoTone(key) {
      this.pianoTone = PIANO_TONES[key] ? key : PIANO_DEFAULT;
    }
    /**
     * 載入四段力度的取樣吉他。四層各是一整組音，所以四個 Sampler 平行載，
     * 全部到齊才算 ready；某一層真的載不到就用最接近的那層頂上。
     */
    async loadLayered(report) {
      if (this.layered || this.layeredLoading) return this.layered;
      this.layeredLoading = true;
      report && report("loading");
      const opts = { bases: LAYERED_BASES, timeout: 9e4 };
      const layers = await Promise.all(
        Array.from({ length: LAYERED_COUNT }, (_, i) => loadSampler("", layeredUrls(i + 1), opts))
      );
      this.layeredLoading = false;
      if (!layers.some(Boolean)) {
        report && report("failed");
        return null;
      }
      layers.forEach((s) => s && s.connect(this.gLayered));
      this.layered = layers.map((s, i) => {
        if (s) return s;
        for (let d = 1; d < LAYERED_COUNT; d++) {
          if (layers[i - d]) return layers[i - d];
          if (layers[i + d]) return layers[i + d];
        }
        return null;
      });
      report && report("ready");
      return this.layered;
    }
    setGuitarTone(t) {
      this.releaseAll(Tone.now());
      const p = TONES[t] || TONES.acoustic;
      this.tone = t;
      this.toneSrc = p.src;
      if (!this.ready) return;
      if (p.src === "layered" && this.gLayered) this.gLayered.volume.value = p.gain == null ? -3 : p.gain;
    }
    duck(time, amt) {
      if (!this.mixOn || !this.mixNodes) return;
      [["guitar", 0.72], ["piano", 0.68], ["bass", 0.55]].forEach(([k, floor]) => {
        const n = this.mixNodes[k];
        if (!n) return;
        const g = n.duck.gain;
        const lo = 1 - (1 - floor) * (amt == null ? 1 : amt);
        try {
          g.cancelScheduledValues(time);
          g.setValueAtTime(1, time);
          g.linearRampToValueAtTime(lo, time + 0.012);
          g.linearRampToValueAtTime(1, time + 0.16);
        } catch (e) {
        }
      });
    }
    setMix(on) {
      this.mixOn = !!on;
      if (!this.mixNodes) return;
      Object.keys(this.mixNodes).forEach((k) => {
        const n = this.mixNodes[k];
        n.panner.pan.value = on ? n.pan : 0;
        if (n.hp && n.hpHz) n.hp.frequency.value = on ? n.hpHz : 20;
        try {
          n.duck.gain.cancelScheduledValues(Tone.now());
          n.duck.gain.value = 1;
        } catch (e) {
        }
      });
      this.glue.ratio.value = on ? 2 : 1;
    }
    setMaster(x) {
      if (!this.ready || !this.gMaster) return;
      this.gMaster.volume.value = x <= 0 ? -Infinity : 20 * Math.log10(x);
    }
    setVolumes(v) {
      if (!this.ready) return;
      const db = (x) => x <= 0 ? -Infinity : 20 * Math.log10(x);
      this.lastGuitarVol = v.guitar;
      this.gGuitar.volume.value = db(v.guitar) - 4;
      this.gPiano.volume.value = db(v.piano) - 13;
      this.gBass.volume.value = db(v.bass) - 9;
      this.gDrum.volume.value = db(v.drum) - 11;
    }
    // 0–1 的力度切成四段，對到取樣的四層力度
    _layerFor(vel) {
      return vel < 0.3 ? 0 : vel < 0.55 ? 1 : vel < 0.8 ? 2 : 3;
    }
    _sampler(vel, midi) {
      if (this.toneSrc === "layered" && this.layered) return this.layered[this._layerFor(vel)];
      if (this.toneSrc === "sampled") return this.guitarTones[this.tone] || null;
      if (this.mode.guitar !== "sample") return null;
      if (this.guitarSoft && midi != null) {
        const th = ACOUSTIC_VEL[midi];
        if (th != null && vel * 127 <= th) return this.guitarSoft;
      }
      return this.guitar;
    }
    _attackString(k, midi, time, vel) {
      const note = midiToName(midi);
      const smp = this._sampler(vel, midi);
      if (smp) {
        const prev = this.ringing[k];
        if (prev) prev.smp.triggerRelease(prev.note, time);
        // 力度已經選過層了，這裡只留一點層內的音量起伏，不要重複算兩次
        const g = this.toneSrc === "layered" ? Math.min(1, 0.78 + vel * 0.22) : vel;
        smp.triggerAttack(note, time + 2e-3, g);
        this.ringing[k] = { note, smp };
      } else {
        const v = this.pluck[k];
        v.g.gain.setValueAtTime(Math.max(0.05, vel * 0.9), time);
        v.p.triggerAttack(note, time);
        this.ringing[k] = null;
      }
    }
    _releaseString(k, time) {
      const prev = this.ringing[k];
      if (!prev) return;
      prev.smp.triggerRelease(prev.note, time);
      this.ringing[k] = null;
    }
    releaseAll(time) {
      for (let k = 0; k < 6; k++) this._releaseString(k, time);
    }
    /**
     * 刷弦核心。真人刷弦有四個特徵，這裡全部模擬：
     * 1) 每條弦錯開 10–30ms（不是同時發聲）
     * 2) 上擊從高音弦起，而且通常少掃一兩條弦
     * 3) 力度越大、手速越快，錯開時間越短
     * 4) 每次的時間與音量都有微小隨機差異
     */
    strum(voicing, { time, dir = "D", vel = 0.85, chordChange = false, strings = null, mute = 0, ghost = false, spreadMs = null, acc = 0, ring = false }) {
      if (!this.ready || !voicing) return;
      let played = [];
      voicing.frets.forEach((f, i) => {
        if (f >= 0) played.push(i);
      });
      if (strings && strings.length) {
        const sub = played.filter((i) => strings.includes(i));
        if (sub.length) played = sub;
      }
      if (!played.length) return;
      if (acc) vel *= acc >= 2 ? 1.32 : 1.16;
      if (ghost) vel = Math.min(vel, 0.2);
      vel = Math.max(0.04, Math.min(1, vel));
      if (chordChange) {
        try {
          this.fretNoise.triggerAttackRelease(0.07, Math.max(0, time - 0.055), 0.5 + Math.random() * 0.3);
        } catch (e) {
        }
      }
      let order = played.slice();
      let spread;
      if (dir === "U") {
        order.reverse();
        if (!strings) {
          const skip = Math.random() < 0.65 ? 2 : 1;
          order = order.slice(0, Math.max(3, order.length - skip));
        }
        spread = 0.013;
      } else if (dir === "R") {
        spread = 0.055;
      } else {
        spread = 0.019;
      }
      const m = dir === "X" ? Math.max(mute, 0.9) : mute;
      if (spreadMs != null) spread = spreadMs / 1e3;
      else spread *= 1.3 - vel * 0.45;
      if (m > 0.55) {
        try {
          this.scratch.triggerAttackRelease(0.05, time, 0.35 + m * 0.35);
        } catch (e) {
        }
        if (spreadMs == null) spread = Math.min(spread, 9e-3);
      }
      const damp = m > 0 ? 0.035 + (1 - m) * 0.18 : 0;
      order.forEach((k, n) => {
        const t = time + n * spread * (0.82 + Math.random() * 0.36);
        const shape = 1 + (n / Math.max(1, order.length - 1) - 0.5) * (dir === "U" ? 0.18 : 0.12);
        const v = Math.max(0.04, Math.min(1, vel * shape * (1 - m * 0.5) * (0.9 + Math.random() * 0.2)));
        const midi = STRING_MIDI[k] + voicing.capo + voicing.frets[k];
        this._attackString(k, midi, t, v);
        if (m > 0 && !ring) this._releaseString(k, t + damp);
      });
      this.onStrum && this.onStrum({ dir, strings: order, spread, vel });
    }
    deadStroke(time, vel, strings) {
      if (!this.ready) return;
      try {
        this.scratch.triggerAttackRelease(0.045, time, Math.max(0.15, vel * 0.8));
      } catch (e) {
      }
      (strings || [2, 3, 4, 5]).forEach((k) => this._releaseString(k, time + 0.02));
      this.onStrum && this.onStrum({ dir: "X", strings: strings || [2, 3, 4, 5], spread: 0.006, vel });
    }
    pick(voicing, stringIdx, time, vel) {
      if (!this.ready || !voicing) return;
      /**
       * 琶音與 Travis 這些樣式的弦號是照六條弦寫的，實際的把位常常沒有六條。
       * 原本只有「指定的弦沒發聲」才退到弦號最近的那條，發聲的就照號碼用
       * ——稀疏的把位會整群擠在一起。強力和弦的 A 型 x 3 5 5 x x 就是這樣：
       * 琶音要三、四、五弦，而三弦本來就有聲音（最高的那顆），於是四個事件
       * 有三個落在同一顆，中間的五度一次都沒被指定到，聽起來偏高而且不像
       * 強力和弦。
       *
       * 改成把整組弦號往高音弦對齊：少幾條弦就整體右移幾格，低音側超出的
       * 夾到最低的那條。這樣四弦、五弦的把位維持原本的對應（D 型的琶音還是
       * D3 A3 D4 F♯4 的上行），只有真的塞不下的稀疏把位才會把聲部攤開。
       * 六條弦全響時位移為 0，行為完全不變。
       *
       * 按比例映射（si / 5 × 聲部數）試過，會連發聲的弦一起挪，四弦的 D 型
       * 會變成 D3 D4 D4 F♯4，反而把好好的上行弄壞。
       */
      const alt = voicing.frets.map((f, i) => f >= 0 ? i : -1).filter((i) => i >= 0);
      if (!alt.length) return;
      const k = alt[Math.min(alt.length - 1, Math.max(0, stringIdx - (6 - alt.length)))];
      this._attackString(k, STRING_MIDI[k] + voicing.capo + voicing.frets[k], time, vel);
      this.onStrum && this.onStrum({ dir: "P", strings: [k], spread: 0, vel });
    }
    playString(k, midi, vel) {
      if (!this.ready) return;
      this._attackString(k, midi, Tone.now() + 0.02, vel == null ? 0.9 : vel);
    }
    playPiano(midis, time, dur, vel) {
      const notes = midis.map(midiToName);
      const smp = this.pianos[this.pianoTone];
      if (smp) smp.triggerAttackRelease(notes, dur, time, vel);
      else this.polyFallback.triggerAttackRelease(notes, dur, time, vel * 0.5);
    }
    playBass(midi, time, dur, vel) {
      const n = midiToName(midi);
      if (this.mode.bass === "sample" && this.bass) this.bass.triggerAttackRelease(n, dur, time, vel);
      else this.bassFallback.triggerAttackRelease(n, dur, time, vel);
    }
    /**
     * 四段強弱：3 小節頭、2 拍頭、1 細分、0 靜音。
     * 高低用音高分而不是只用音量——細分點很密時，光靠音量差聽不出哪一下是拍頭。
     */
    playClick(level, time) {
      if (!this.click || !level) return;
      const spec = CLICK_LEVELS[level] || CLICK_LEVELS[1];
      this.click.triggerAttackRelease(spec[0], 0.03, time, spec[1]);
    }
    setClickVol(db) {
      if (this.clickVol) this.clickVol.volume.value = db;
    }
    playDrum(kind, time, vel) {
      const k = this.drums && this.drums[kind];
      if (this.mode.drum === "sample" && k) {
        const spec = DRUM_KIT[kind];
        const n = k.layers.length;
        const t = Math.max(0, Math.min(1, (vel - spec.lo) / (spec.hi - spec.lo)));
        const li = Math.min(n - 1, Math.floor(t * n));
        const bank = k.layers[li];
        // 輪替：同一層裡不連著用同一個取樣，連續的 hi-hat 才不會像機關槍
        let pick = Math.floor(Math.random() * bank.length);
        if (bank.length > 1 && pick === k.last[li]) pick = (pick + 1) % bank.length;
        k.last[li] = pick;
        // 取樣每一層都做過峰值正規化，層跟層之間沒有音量差，只有音色差（重擊的殘響
        // 較長）。所以動態還是得靠 vel，不然重拍弱拍會一樣大聲、groove 會被壓平。
        // trim 是拿舊鼓組的 RMS 校準出來的，換音色後混音比例才不會跑掉。
        const level = spec.trim * vel;
        try {
          const g = new Tone.Gain(level).connect(this.drumGains[kind]);
          const src = new Tone.ToneBufferSource(bank[pick]).connect(g);
          src.onended = () => {
            try { src.dispose(); g.dispose(); } catch (e) {}
          };
          src.start(time);
        } catch (e) {
        }
        return;
      }
      if (kind === "kick") this.kick.triggerAttackRelease("C1", 0.22, time, vel);
      else if (kind === "snare") this.snare.triggerAttackRelease(0.14, time, vel);
      else this.hat.triggerAttackRelease(0.03, time, vel * 0.55);
    }
  }

  // ────────────────────────────────────────────────────────────────────────
  // 9. 存檔
  // localStorage，存進行、混音設定與試用次數。
  // ────────────────────────────────────────────────────────────────────────

  /**
   * 編輯存檔。每個範本各自記住自己的編輯，切走再切回來不會變回預設；
   * 混音類的設定（音量、頻道開關）則是全域的，換範本不該跟著變。
   * 沒有套用任何範本時的自由編輯存在 FREE_KEY 底下。
   */
  const SAVE_KEY = "chordlab.save.v1";
  const FREE_KEY = "__free";
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      const o = raw ? JSON.parse(raw) : null;
      return o && typeof o === "object" ? { tpl: o.tpl || {}, mix: o.mix || null } : { tpl: {}, mix: null };
    } catch (e) {
      return { tpl: {}, mix: null };
    }
  }
  function writeSave(data) {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (e) {
      // 無痕模式或容量滿了就算了，不影響使用
    }
  }

  // ────────────────────────────────────────────────────────────────────────
  // 10. 把位與音階盒
  // scaleBoxFrets 產生 CAGED 與一弦三音的框；
  // buildVoice / voiceInfo 把一個指型變成畫得出來的資料。
  // ────────────────────────────────────────────────────────────────────────

  const VKEY = (ch) => "c" + ch.id;
  const WINDOWS = [null, [0, 2], [1, 3], [2, 4], [3, 5], [0, 3], [1, 4], [2, 5]];
  /**
   * 音階把位模型。矩形的格數視窗會切斷音階——C 大調 A 型框第 3–6 格時，
   * 6 弦停在 A、5 弦卻從 C 開始，中間的 B 落在框外，讀起來就不是 5 6 7 R。
   *
   * 改成順著音階走：每條弦都從「前一條弦最後那個音的下一個音階音」接下去，
   * 中間就不會有缺口。
   *   caged：一指一格的四格視窗，七聲音階下每弦 2–3 音，五個指型各有
   *          自己的分佈（3-3-3-2-3-3、2-3-3-3-3-2、3-3-2-3-3-3、
   *          3-3-3-3-2-3、3-2-3-3-3-3），兩音弦每換一個把位就移一條弦
   *   3nps ：每弦固定三音，讀起來是 R 2 3｜4 5 6｜7 R 2，但跨度到 6–7 格
   * 回傳每條弦要納入的格數陣列。
   */
  // 一弦三音就是每條弦三個音，六弦剛好十八個音，沒有例外——這是這套系統的定義，
  // 也是它跟 CAGED 最大的差別（CAGED 才會 3 音 2 音交替）。
  // 這套系統本來是為七聲音階設計的：相鄰弦差五個半音，七聲平均 1.7 半音一個音，
  // 三個音剛好接得上下一條弦。音階愈密（藍調、減音階）圖形就會愈往高把位漂。
  const NPS = 3;
  // 一個把位就是四格的視窗，加上一格伸展——CAGED 圖形的標準寬度
  const BOX_SPAN = 5;
  function scaleBoxFrets(scalePcs, anchor, sys, capo, nf) {
    const cols = STRING_MIDI.map((base) => {
      const arr = [];
      for (let f = 0; f <= nf; f++) {
        if (f > 0 && f < capo) continue;
        if (f === 0 && capo > 0) continue;
        if (scalePcs.has((base + f) % 12)) arr.push(f);
      }
      return arr;
    });
    // 半音階十二個音全開，本來就沒有「音階把位」這回事——每弦三個音只走三格，
    // 弦距卻是五格，順著音階走圖形會一路往琴頭塌。這種就回歸把位的本義：
    // 這個把位視窗裡的所有音。三弦到二弦只差四個半音，視窗在這裡會疊到同一個音，
    // 已經出現過的音高就跳過，讀起來才不會重複。
    if (scalePcs.size >= 12) {
      const wLo = Math.max(capo, anchor), wHi = Math.min(nf, anchor + BOX_SPAN - 1);
      const seen = new Set();
      return STRING_MIDI.map((base) => {
        const arr = [];
        for (let f = wLo; f <= wHi; f++) {
          if (seen.has(base + f)) continue;
          seen.add(base + f);
          arr.push(f);
        }
        return arr;
      });
    }
    /**
     * 哪個系統適用哪種音階，照教材走：
     *   七聲音階 —— CAGED 五個指型與一弦三音七個圖形都成立，兩個都給
     *   八音的減音階 —— 對稱音階，教材的系統是每弦音數一致的三音一弦
     *     （指法 1-3-4 與 1-2-4 交替）與四音一弦，不是 CAGED 的 2/3 交替。
     *     硬套 CAGED 會排出 3-3-4-2-4-3 這種三不像，所以一律走一弦三音。
     *   五聲與藍調 —— 教材有五個盒型，走 CAGED
     */
    if (scalePcs.size === 8) sys = "3nps";
    else if (sys === "3nps" && scalePcs.size !== 7) sys = "caged";
    /**
     * CAGED 是「一指一格」的四格視窗，正因為四格裝不下固定的音數，
     * 才會出現 3 音 2 音交替——那是這套系統的特徵，不是缺陷。
     * 原本的做法是每弦走三音、跨度放寬到五格，結果每個指型都變成
     * 3-3-3-3-2-3，跟一弦三音幾乎一樣，等於沒有 CAGED。
     *
     * C 大調 E 型（視窗 7–11）讀起來是 7R2｜345｜67R｜234｜56｜7R2。
     * 第五格只當伸展音：下一條弦在四格內接不到中間那個音時才用，
     * 不然音階會斷格（G 型、D 型都會踩到）。
     */
    if (sys !== "3nps") {
      // 上緣要從原始錨點算，不能從裁過的下緣算——不然開放把位的視窗會整個
      // 往上推一格，跟同一個指型在高把位長得不一樣。
      const w = Math.max(capo, anchor);
      const hi = Math.min(nf, anchor + BOX_SPAN - 1);
      const win = STRING_MIDI.map((base) => {
        const arr = [];
        for (let f = w; f <= hi; f++) if (scalePcs.has((base + f) % 12)) arr.push(f);
        return arr;
      });
      /**
       * 藍音是夾在三個連續半音正中間的經過音——大調藍調的 ♭3（2-♭3-3）、
       * 小調藍調的 ♭5（4-♭5-5）。教材都把它跟「下面那個音」放在同一條弦上，
       * 因為它是滑上去的經過音，不會讓它去當下一條弦的開頭。
       * 這個條件只在兩個藍調音階成立，其他音階（含七聲、減音階）都不會誤中。
       */
      const isBlue = (midi) => scalePcs.has(midi % 12)
        && scalePcs.has((midi + 11) % 12) && scalePcs.has((midi + 1) % 12);
      /**
       * CAGED 一條弦 2–3 音是這套系統的定義，模塊是一顆一顆彈的旋律圖形，
       * 所以第四個音不是「多給你一顆」，是把圖形讀壞了。四格視窗裡湊得出
       * 四個音階音的情況真的存在：和聲小調（♭6-7 與 2-♭3 兩組半音）、
       * 旋律小調、Altered，以及兩個藍調音階再加上黏在後面的藍音。
       * 滿了就收手，剩下的留給下一條弦——`last` 不動，下一條弦會從這裡接上，
       * 音階不會斷。
       */
      const PER_STRING_MAX = 3;
      const box = STRING_MIDI.map(() => []);
      let last = -1;
      for (let i = 0; i < STRING_MIDI.length; i++) {
        const base = STRING_MIDI[i];
        for (const f of win[i]) {
          if (base + f <= last) continue;
          // 藍音一定要跟它下面那個音同弦；接不上（在弦首、或視窗容不下）就不放，
          // 因為藍調的圖形本來就是五聲盒型再把藍音黏在那個音旁邊
          if (isBlue(base + f) && !(box[i].length && base + f - last === 1)) continue;
          if (f > w + BOX_SPAN - 2) {
            const keepBlue = isBlue(base + f) && last >= 0 && base + f - last === 1;
            const nx = i + 1 < STRING_MIDI.length ? win[i + 1] : null;
            const reachable = !keepBlue && nx && nx.some((g) => g <= w + BOX_SPAN - 2
              && STRING_MIDI[i + 1] + g > last && STRING_MIDI[i + 1] + g <= base + f);
            if (reachable) continue;
          }
          if (box[i].length >= PER_STRING_MAX) {
            // 收手的前提是下一條弦接得到這顆音。接不到還硬收，音階就從中間
            // 斷掉一顆——模塊是拿來一顆一顆彈旋律的，斷格比多一顆音嚴重得多，
            // 所以這種時候寧可讓這條弦破例到四音。
            const nx2 = i + 1 < STRING_MIDI.length ? win[i + 1] : null;
            if (nx2 && nx2.some((g) => STRING_MIDI[i + 1] + g === base + f)) break;
          }
          box[i].push(f);
          last = base + f;
        }
        // 藍音是滑上去的經過音，跟著下面那個音走——那個音在這條弦上，藍音就在這條弦上，
        // 就算落在視窗外一格也一樣。少了它，弦上會出現「2」後面空著的斷句。
        if (box[i].length && box[i].length < PER_STRING_MAX) {
          const nextF = box[i][box[i].length - 1] + 1;
          if (nextF <= nf && isBlue(base + nextF)) {
            box[i].push(nextF);
            last = base + nextF;
          }
        }
      }
      return box;
    }
    const want = NPS;
    const picked = STRING_MIDI.map(() => []);
    const nextOn = (i, above) => {
      const base = STRING_MIDI[i], list = cols[i];
      for (let k = 0; k < list.length; k++) if (base + list[k] > above) return { f: list[k], midi: base + list[k] };
      return null;
    };
    let prevMidi = -1, lo = Infinity;
    for (let i = 0; i < STRING_MIDI.length; i++) {
      const base = STRING_MIDI[i], list = cols[i];
      let k = 0;
      if (prevMidi < 0) {
        while (k < list.length && list[k] < anchor) k++;
        if (k >= list.length) k = Math.max(0, list.length - 1);
        // 錨點常常落在兩個音階音中間，往回一個才不會把把位整個推高
        if (k > 0 && list[k] > anchor) k--;
      } else {
        while (k < list.length && base + list[k] <= prevMidi) k++;
      }
      for (let n = 0; n < want && k + n < list.length; n++) {
        const f = list[k + n];
        // CAGED 的跨度限制：已經有兩個音之後就不再往外撐
        if (sys !== "3nps" && picked[i].length >= 2 && f - Math.min(lo, list[k]) > 4) break;
        picked[i].push(f);
        lo = Math.min(lo, f);
        prevMidi = base + f;
      }
      // 換弦前先確認下一條弦接得上。接不上代表中間那個音只有這條弦有，
      // 不補的話音階就會斷一格——和聲小調的增二度最容易踩到。
      if (i + 1 < STRING_MIDI.length) {
        for (let guard = 0; guard < 4; guard++) {
          // 每弦音數是硬規則，補洞不能把某一條弦撐破。一弦三音固定三個音，
          // CAGED 是 2–3 音，兩者都不該出現第四個。
          if (picked[i].length >= want) break;
          const mine = nextOn(i, prevMidi), theirs = nextOn(i + 1, prevMidi);
          if (!mine || !theirs || mine.midi >= theirs.midi) break;
          picked[i].push(mine.f);
          lo = Math.min(lo, mine.f);
          prevMidi = mine.midi;
        }
      }
    }
    return picked;
  }

  /**
   * 換和弦屬性時要接到哪一個把位。
   *
   * getVoicings 是照 pos 由低到高排的，所以原本一律接 vs[0] 等於「不管你
   * 本來按在第幾格，換個屬性就跳回最低把位」。在高把位改屬性（C 大三 →
   * Cmaj7）等於選好的位置被丟掉，得重按一次。
   *
   * 改成挑離原本把位最近的那個。距離一樣時優先同一個 CAGED 指型——C 型的
   * 大三接到 C 型的 maj7 是最自然的接法，手型幾乎不用動。
   *
   * cur 要傳 getVoicings 的那一筆（buildVoice 的 voicing.shape），不要傳
   * buildVoice 自己算的 pos——後者是「最低的發聲品」，開放和弦會算成 1 或 2，
   * 跟 getVoicings 的 0 對不起來，比距離會偏掉。
   */
  function nearestVoicing(vs, cur) {
    if (!vs.length || !cur) return 0;
    let best = 0, bestD = Infinity, bestSame = false;
    for (let i = 0; i < vs.length; i++) {
      const d = Math.abs(vs[i].pos - cur.pos);
      const same = vs[i].tag === cur.tag;
      if (d < bestD || (d === bestD && same && !bestSame)) { best = i; bestD = d; bestSame = same; }
    }
    return best;
  }
  function buildVoice(rootPc, quality, capo, cfg) {
    const vs = getVoicings(rootPc, quality, capo);
    const shape = vs[(cfg.shapeIdx || 0) % vs.length];
    let frets = shape.frets.slice();
    const win = cfg.win || null;
    if (win) frets = frets.map((f, i) => i >= win[0] && i <= win[1] ? f : -1);
    const baseFrets = frets.slice();
    const ov = cfg.ov || {};
    Object.keys(ov).forEach((k) => { frets[+k] = ov[k]; });
    const lit = frets.filter((f) => f > 0);
    return { key: frets.join(","), frets, baseFrets, tag: shape.tag, pos: lit.length ? Math.min(...lit) : 1, capo, shape, allShapes: vs };
  }
  function voiceInfo(rootPc, quality, frets, capo, sp) {
    const midis = voicingToMidi(frets, capo).slice().sort((a, b) => a - b);
    const blank = { name: chordLabel(rootPc, quality, null, sp), inv: "", stack: "", extra: [], missing: [] };
    if (!midis.length) return blank;
    const semis = midis.map((m) => semiOf(m % 12, rootPc));
    const set = new Set(semis);
    const iv = QUALITIES[quality].iv.map((i) => ((i % 12) + 12) % 12);
    const bass = semis[0];
    const missing = iv.filter((i) => !set.has(i));
    const extra = [...set].filter((sm) => !iv.includes(sm)).sort((a, b) => a - b);
    let q2 = quality, ex = extra.slice();
    const up = (has, to) => { if (ex.includes(has)) { q2 = to; ex = ex.filter((x) => x !== has); } };
    if (quality === "maj") { up(10, "dom7"); up(11, "maj7"); }
    else if (quality === "min") { up(10, "min7"); }
    let name = chordLabel(rootPc, q2, null, sp);
    ex.forEach((sm) => name += "add" + IV_LABEL[sm]);
    if (missing.includes(3) || missing.includes(4)) name += "no3";
    if (missing.includes(7)) name += "no5";
    if (bass !== 0) name += "/" + sp.note((rootPc + bass) % 12);
    const inv = bass === 0 ? "\u6839\u97f3\u4f4d\u7f6e" : bass === 3 || bass === 4 ? "\u7b2c\u4e00\u8f49\u4f4d" : bass === 6 || bass === 7 || bass === 8 ? "\u7b2c\u4e8c\u8f49\u4f4d" : bass === 10 || bass === 11 || isDimSeventh(bass, quality) ? "\u7b2c\u4e09\u8f49\u4f4d" : "\u4f4e\u97f3 " + ivLabel(bass, quality);
    return { name, inv, stack: semis.map((sm) => ivLabel(sm, quality)).join("-"), extra: ex, missing };
  }

  // ────────────────────────────────────────────────────────────────────────
  // 11. 律動與排程
  // 重音輪廓與搖擺感，buildSchedule 把一段進行攤平成
  // Tone.js 的事件清單。
  // ────────────────────────────────────────────────────────────────────────

  const METRIC_W = [1, 0.34, 0.62, 0.4, 0.85, 0.34, 0.66, 0.4, 0.92, 0.34, 0.64, 0.4, 0.86, 0.36, 0.68, 0.42];
  const ACCENT_PROFILES = {
    straight: { depth: 0.55, back: 0.05, arc: 0.05 },
    backbeat: { depth: 0.5, back: 0.14, arc: 0.05 },
    drive: { depth: 0.4, back: 0.08, arc: 0.04 },
    laid: { depth: 0.68, back: 0.12, arc: 0.07 },
    swung: { depth: 0.6, back: 0.16, arc: 0.06 }
  };
  const STRUM_FEEL = {
    down4: "straight",
    pop8: "backbeat",
    alt8: "drive",
    arp: "straight",
    jazzcomp: "swung",
    roll: "straight",
    travis: "straight",
    skank: "backbeat",
    countryBoom: "backbeat"
  };
  function accentAt(i, prof, barPos) {
    const p = ACCENT_PROFILES[prof] || ACCENT_PROFILES.straight;
    const w = METRIC_W[((i % 16) + 16) % 16];
    let f = 1 - p.depth + p.depth * w;
    if (p.back && (i === 4 || i === 12)) f *= 1 + p.back;
    if (p.arc) f *= 1 + p.arc * (barPos - 0.45);
    return f;
  }
  // 節拍器四段強弱的音高與力度。3 小節頭、2 拍頭、1 細分、0 靜音（不發聲）
  const CLICK_LEVELS = { 3: ["C7", 0.85], 2: ["G6", 0.6], 1: ["C6", 0.36] };
  // 每拍可以切成幾下。三連音是 3，所以間隔會是 4/3 個十六分格——Tone 的
  // bar:beat:sixteenth 記法吃小數（實測 "0:0:0.5" 在 120BPM 是 0.0625 秒，
  // 剛好三十二分音符），所以三連與三十二分都排得出來。
  const METRO_DIVS = [[1, "4分"], [2, "8分"], [3, "三連"], [4, "16分"], [8, "32分"]];
  const metroDefaultPat = (div) => Array.from({ length: 4 * div },
    (_, i) => i === 0 ? 3 : i % div === 0 ? 2 : 1);
  const SIX = (b) => Math.max(1, Math.round(b * 4));
  const beatsOf = (ch) => ch.beats != null ? ch.beats : (ch.bars || 1) * 4;
  function buildSchedule(prog, opts) {
    const { strumKey, drumKey, bassKey, pianoKey, capo, useGuitar, usePiano, useBass, useDrum, useClick } = opts;
    const metroDiv = opts.metroDiv || 1;
    const metroPat = opts.metroPat || metroDefaultPat(metroDiv);
    const events = [];
    // abs 可能是小數（節拍器的細分點），bar:beat:sixteenth 三段都要跟著算得對
    const at = (abs) => `${Math.floor(abs / 16)}:${Math.floor(abs % 16 / 4)}:${abs % 4}`;
    const feel = STRUM_FEEL[strumKey] || "straight";
    const sp = STRUM_PATTERNS[strumKey] || STRUM_PATTERNS.roll || { events: [] };
    const bp = BASS_PATTERNS[bassKey];
    const pp = PIANO_PATTERNS[pianoKey] || PIANO_PATTERNS[PIANO_PATTERN_DEFAULT];
    // 貝斯在場時鋼琴讓出根音，兩者才不會在低頻打架
    const dropRoot = !!useBass && bassKey !== "none";
    let prevTop = null, prevBass = null;
    // useDrum 原本被解構卻沒用到，關掉鼓的頻道仍然會排事件、照樣出聲
    const dp = useDrum && drumKey !== "none" ? DRUM_PATTERNS[drumKey] : null;
    const drumAt = {};
    if (dp) {
      const put = (arr, kind, v, depth) => arr.forEach((i) => {
        const w = METRIC_W[((i % 16) + 16) % 16];
        (drumAt[i] = drumAt[i] || []).push({
          drum: kind,
          vel: Math.max(0.12, Math.min(1, v * (1 - depth + depth * w))),
          duck: kind === "kick"
        });
      });
      put(dp.kick, "kick", 0.95, 0.14);
      put(dp.snare, "snare", 0.82, 0.1);
      put(dp.hat, "hat", 0.66, 0.6);
    }
    let cur = 0;
    prog.forEach((ch, ci) => {
      const span = SIX(beatsOf(ch));
      const voicing = ch.voicing;
      const rootMidi = 28 + ((ch.bassPc != null ? ch.bassPc : ch.rootPc) - 4 + 12) % 12;
      const nx = prog[(ci + 1) % prog.length] || ch;
      const nextRoot = 28 + ((nx.bassPc != null ? nx.bassPc : nx.rootPc) - 4 + 12) % 12;
      const voice = pianoVoicing(ch.rootPc, ch.quality, prevTop, dropRoot);
      prevTop = voice[voice.length - 1];
      events.push({ time: at(cur), kind: "mark", chordIdx: ci, bar: Math.floor(cur / 16), beat: cur / 4 });
      for (let k = 0; k < span; k++) {
        const abs = cur + k;
        const slot = abs % 16;
        const first = k === 0;
        if (useGuitar && !ch.mG) {
          sp.events.forEach((e) => {
            if (e.i !== slot) return;
            const shaped = e.g ? e.v : Math.min(1, e.v * accentAt(e.i, feel, e.i / 16));
            events.push({
              time: at(abs),
              kind: e.d === "P" ? "pick" : "strum",
              dir: e.d, vel: shaped, strings: e.s, mute: e.m, ghost: e.g,
              acc: e.a, spreadMs: e.sp, ring: e.r,
              dead: e.x ? 1 : 0,
              voicing, chordIdx: ci, chordChange: first, beat: abs / 4
            });
          });
        }
        if (usePiano && !ch.mP) {
          pp.events.forEach((e) => {
            if (e.i !== slot) return;
            // 長音鋪底要跨滿整個和弦，其他節奏型照自己的長度
            const len = pp === PIANO_PATTERNS.pad ? span : e.len;
            events.push({
              time: at(abs), kind: "piano",
              notes: e.n == null ? voice : [voice[e.n % voice.length]],
              dur: Math.max(0.35, len / 4 * 0.9),
              vel: (e.v == null ? 0.55 : e.v) * accentAt(e.i, feel, e.i / 16),
              chordIdx: ci, beat: abs / 4
            });
          });
        }
        if (useBass && bp.events.length) {
          bp.events.forEach((e) => {
            if (e.i !== slot) return;
            const midi = bassNote(e, rootMidi, ch.quality, nextRoot, prevBass);
            prevBass = midi;
            events.push({
              time: at(abs), kind: "bass", midi,
              dur: e.len * 0.55, vel: 0.8, chordIdx: ci, beat: abs / 4
            });
          });
        }
        if (dp && drumAt[slot]) {
          drumAt[slot].forEach((d) => events.push({
            time: at(abs), kind: "drum", drum: d.drum, vel: d.vel,
            duck: d.duck, chordIdx: ci, beat: abs / 4
          }));
        }
        /**
         * 節拍器。一拍切成 metroDiv 下，所以只在拍頭進來一次，然後把該拍的
         * 細分點一次排完——這樣三連音（間隔 4/3 個十六分格）跟三十二分
         * （間隔 0.5）用同一段程式就出得來，不必為了細於十六分而改主格線。
         *
         * 靜音的拍點仍然要送事件，只是不發聲：燈號要照樣走過去，不然被你
         * 設成靜音的那一格看起來像卡住。
         */
        if (useClick && abs % 4 === 0) {
          const step = 4 / metroDiv;
          const beatInBar = abs % 16 / 4;
          for (let k = 0; k < metroDiv; k++) {
            const tick = beatInBar * metroDiv + k;
            events.push({
              time: at(abs + k * step), kind: "click",
              level: metroPat[tick] == null ? 1 : metroPat[tick],
              tick, chordIdx: ci, beat: (abs + k * step) / 4
            });
          }
        }
      }
      cur += span;
    });
    return { events, totalBars: Math.max(1, Math.ceil(cur / 16)) };
  }

  // ────────────────────────────────────────────────────────────────────────
  // 12. 主元件 ChordLab
  // 所有狀態與互動都在這裡。這個函式很大，內部另有分段標示。
  // ────────────────────────────────────────────────────────────────────────

  const NOTE_LENS = [
    { b: 0.5, g: "\u266a", n: "\u516b\u5206", t: "\u534a\u62cd" },
    { b: 1, g: "\u2669", n: "\u56db\u5206", t: "\u4e00\u62cd" },
    { b: 2, g: "\u02d9", n: "\u4e8c\u5206", t: "\u4e8c\u62cd" },
    { b: 3, g: "\u02d9\u00b7", n: "\u9644\u9ede\u4e8c\u5206", t: "\u4e09\u62cd" },
    { b: 4, g: "\u25cb", n: "\u5168\u97f3\u7b26", t: "\u4e00\u5c0f\u7bc0" },
    { b: 8, g: "\u25cb\u25cb", n: "\u5169\u5c0f\u7bc0", t: "\u516b\u62cd" }
  ];
  // 便利貼的四種傾斜角。照 c.id 取，一張紙的角度就跟著它一輩子
  const ROT4 = ["-1.6deg", "1.1deg", "-0.5deg", "1.9deg"];
  let UID = 1;
  const mkChord = (rootPc, quality, bars = 1) => ({
    id: UID++,
    rootPc: (rootPc % 12 + 12) % 12,
    quality,
    bassPc: null,
    bars,
    voiceIdx: 0
  });
  function ChordLab() {

    // ── 狀態 ──────────────────────────────────────────────────────────
    // 三十幾個 useState。改任何一個都會重畫，所以順序不重要，
    // 照「調性 → 進行 → 指板 → 音訊 → 混音」分群擺。

    const [booted, setBooted] = useState(false);
    const [status, setStatus] = useState({ guitar: "idle", piano: "idle", bass: "idle", drum: "idle" });
    const [keyPc, setKeyPc] = useState(0);
    const [mode, setMode] = useState("major");
    const [bpm, setBpm] = useState(92);
    const [bpmText, setBpmText] = useState("92");
    /**
     * 敲擊定速：連續敲的間隔平均起來就是速度。三秒沒敲就重來，
     * 不然上一輪的殘留會把平均值拉歪。
     */
    const tapTempo = () => {
      const now = performance.now();
      const arr = tapRef.current.filter((t) => now - t < 3e3);
      arr.push(now);
      tapRef.current = arr.slice(-6);
      if (arr.length < 2) return;
      const gaps = arr.slice(1).map((t, i) => t - arr[i]);
      const avg = gaps.reduce((a, b) => a + b, 0) / gaps.length;
      const n = Math.round(6e4 / avg);
      if (n >= 40 && n <= 220) setBpm(n);
    };
    const cycleTick = (i) => setMetroPats((m) => {
      const cur = (m[metroDiv] || metroDefaultPat(metroDiv)).slice();
      // 一般 → 次重音 → 重音 → 靜音 → 一般
      cur[i] = { 1: 2, 2: 3, 3: 0, 0: 1 }[cur[i] == null ? 1 : cur[i]];
      return { ...m, [metroDiv]: cur };
    });
    const [capo, setCapo] = useState(0);
    const [seventhMode, setSeventhMode] = useState(false);
    /**
     * 升降記號的寫法，只有升與降兩種，由使用者決定。
     * C♯ 與 D♭ 音高相同但級數與導音的寫法不同，動機從哪個音出發會影響該用哪種。
     *
     * 原本還有一個「自動」（照調號推導）並且是預設，後來拿掉了。代價是寫法不再
     * 跟著調號走：G 大調的 F♯ 在降記號模式會寫成 G♭，F 大調的 B♭ 在升記號模式
     * 會寫成 A♯——樂理上不對，但既然是手動指定就照選的走。
     * 預設用降記號，跟拿掉自動之前選單長的樣子一致。
     */
    const [accidental, setAccidental] = useState("flat");
    const [prog, setProg] = useState(() => [
      mkChord(0, "maj"),
      mkChord(7, "maj"),
      mkChord(9, "min"),
      mkChord(5, "maj")
    ]);
    const [voiceMap, setVoiceMap] = useState({});
    const [selId, setSelId] = useState(null);
    const [neckOpen, setNeckOpen] = useState(false);
    const [expOpen, setExpOpen] = useState(false);
    // 調內音一律顯示：原本的隱藏按鈕跟「透明顯示」看起來差不多，功能重疊
    const showScale = true;
    // 指板音點的實色模式：off 維持半透明、all 全指板打亮、pos 只打亮目前把位
    const [neckSolid, setNeckSolid] = useState("off");
    // 把位模型的系統：caged 每弦 2–3 音、3nps 每弦固定三音
    const [posSys, setPosSys] = useState("caged");
    // 一弦三音的七個圖形要直接切換時選哪一個；0 = 自動（跟著和弦把位跑）
    const [boxPat, setBoxPat] = useState(0);
    const [neckScale, setNeckScale] = useState(null);
    const [labelMode, setLabelMode] = useState("deg");
    const [swing, setSwing] = useState(0);
    const [metro, setMetro] = useState(false);
    const [metroOpen, setMetroOpen] = useState(false);
    const [metroDiv, setMetroDiv] = useState(1);
    // 重音樣式按細分數分開存，切回去原本的細分時你調過的重音還在
    const [metroPats, setMetroPats] = useState({});
    const [metroVol, setMetroVol] = useState(-8);
    const [metroTick, setMetroTick] = useState(-1);
    const metroPat = metroPats[metroDiv] || metroDefaultPat(metroDiv);
    // 排程的 callback 是閉包，面板開關要用 ref 讀才拿得到當下的值
    const metroOpenRef = useRef(false);
    metroOpenRef.current = metroOpen;
    const tapRef = useRef([]);
    const [gtone, setGtone] = useState("acoustic");
    const [ptone, setPtone] = useState(PIANO_DEFAULT);
    const [playing, setPlaying] = useState(false);
    const [curIdx, setCurIdx] = useState(-1);
    const [recording, setRecording] = useState(false);
    const [sweep, setSweep] = useState({ id: 0, dir: "D", spread: 0.02, strings: [] });
    const [toast, setToast] = useState("");
    // 便利貼拖曳：dragId 是被拿起來那張，dropIdx 是空位現在停在哪
    const [dragId, setDragId] = useState(null);
    const [dropIdx, setDropIdx] = useState(-1);
    const [strumKey, setStrumKey] = useState("roll");
    const [drumKey, setDrumKey] = useState("rock");
    const [bassKey, setBassKey] = useState("fifth");
    const [pianoKey, setPianoKey] = useState(PIANO_PATTERN_DEFAULT);
    // 單點試聽要聽到哪些樂器。和混音區的頻道開關分開，才能「播放開吉他、試聽只聽鋼琴」。
    // 預設只開吉他，跟以前的行為一致。
    const savedRef = useRef(null);
    if (savedRef.current == null) savedRef.current = loadSave();
    const [tmplId, setTmplId] = useState(null);
    const [previewOn, setPreviewOn] = useState(() => (savedRef.current.mix && savedRef.current.mix.previewOn) || { guitar: true, piano: false, bass: false, drum: false });
    const [vols, setVols] = useState(() => (savedRef.current.mix && savedRef.current.mix.vols) || { guitar: 0.3, piano: 1.6, bass: 0.8, drum: 0.8 });
    const [autoMix, setAutoMix] = useState(() => savedRef.current.mix ? !!savedRef.current.mix.autoMix : true);
    const [master, setMaster] = useState(() => (savedRef.current.mix && savedRef.current.mix.master) != null ? savedRef.current.mix.master : 1);
    const [on, setOn] = useState(() => (savedRef.current.mix && savedRef.current.mix.on) || { guitar: true, piano: false, bass: true, drum: true });

    // ── 參照與基本衍生值 ──────────────────────────────────────────────
    // sp 是音名拼字器，engineRef 是音訊引擎，其餘 ref 存的是
    // 不該觸發重畫的東西（播放中的 part、錄音器、拖曳狀態）。

    // 調決定主音怎麼拼，其餘音名全部由字母推導出來
    const sp = React.useMemo(() => makeSpeller(keyPc, mode, accidental), [keyPc, mode, accidental]);
    const engineRef = useRef(null);
    const partRef = useRef(null);
    const recRef = useRef(null);
    const dragRef = useRef(null);
    const ghostRef = useRef(null);
    const flipRef = useRef(new Map());
    const sweepId = useRef(0);
    const startAtRef = useRef({ tick: 0, idx: -1 });
    const histRef = useRef({ past: [], future: [], last: null, skip: false });

    const scale = scaleOf(mode);
    const triads = triadsOf(mode);
    const sevenths = seventhsOf(mode);
    const romans = romanOf(mode);
    // 開機第一輪不要存，不然還沒載入就把預設值蓋回存檔
    const saveArmed = useRef(false);

    // ── 存檔、通知與復原 ──────────────────────────────────────────────
    // localStorage 的寫入時機、toast、以及 undo / redo 的歷史堆疊。

    useEffect(() => {
      const t = setTimeout(() => { saveArmed.current = true; }, 0);
      return () => clearTimeout(t);
    }, []);
    const persist = (mut) => {
      const data = savedRef.current;
      mut(data);
      writeSave(data);
    };
    // 範本層：和弦、把位、節奏型、音色等，各範本各自記
    useEffect(() => {
      if (!saveArmed.current) return;
      persist((d) => {
        d.tpl[tmplId || FREE_KEY] = {
          prog: prog.map((c) => ({ id: c.id, rootPc: c.rootPc, quality: c.quality, bars: c.bars, beats: c.beats, bassPc: c.bassPc, mG: c.mG, mP: c.mP, mB: c.mB, voiceIdx: c.voiceIdx })),
          voiceMap, keyPc, mode, accidental, capo, bpm, swing, seventhMode,
          strumKey, drumKey, bassKey, pianoKey, gtone, ptone
        };
      });
    }, [tmplId, prog, voiceMap, keyPc, mode, accidental, capo, bpm, swing, seventhMode, strumKey, drumKey, bassKey, pianoKey, gtone, ptone]);
    // 混音層：全域，換範本不跟著變
    useEffect(() => {
      if (!saveArmed.current) return;
      persist((d) => { d.mix = { vols, on, previewOn, master, autoMix }; });
    }, [vols, on, previewOn, master, autoMix]);
    const notify = (m) => {
      setToast(m);
      setTimeout(() => setToast(""), 2200);
    };
    useEffect(() => {
      const h = histRef.current;
      if (h.last === null) { h.last = prog; return; }
      if (h.last === prog) return;
      if (h.skip) { h.skip = false; h.last = prog; return; }
      h.past.push(h.last);
      if (h.past.length > 120) h.past.shift();
      h.future = [];
      h.last = prog;
    }, [prog]);
    const undo = useCallback(() => {
      const h = histRef.current;
      if (!h.past.length) { notify("沒有可以復原的步驟"); return; }
      const prev = h.past.pop();
      h.future.push(h.last);
      h.skip = true;
      h.last = prev;
      setProg(prev);
      notify("已復原");
    }, []);
    const redo = useCallback(() => {
      const h = histRef.current;
      if (!h.future.length) { notify("沒有可以重做的步驟"); return; }
      const next = h.future.pop();
      h.past.push(h.last);
      h.skip = true;
      h.last = next;
      setProg(next);
      notify("已重做");
    }, []);

    // ── 衍生資料 ──────────────────────────────────────────────────────
    // progV 是整份進行加上每個和弦算好的指型，畫面幾乎都讀它。
    // starts / barMap / suggestions 都由它推出來。

    const progV = useMemo(
      () => prog.map((c) => {
        const cfg = voiceMap[VKEY(c)] || { shapeIdx: c.voiceIdx || 0 };
        const v = buildVoice(c.rootPc, c.quality, capo, cfg);
        return {
          ...c,
          cfg,
          voiceIdx: (cfg.shapeIdx || 0) % v.allShapes.length,
          voicing: v,
          allVoicings: v.allShapes,
          // 音程分析與和弦命名跟移調夾無關——整組一起往上移，音程不變。
          // 這裡傳 0，名稱才會是你手指按的那個和弦
          info: voiceInfo(c.rootPc, c.quality, v.frets, 0, sp)
        };
      }),
      [prog, capo, voiceMap, sp]
    );
    const selected = progV.find((c) => c.id === selId) || null;
    const starts = useMemo(() => {
      let b = 0;
      return progV.map((c) => { const at = b; b += SIX(beatsOf(c)); return at; });
    }, [progV]);
    const selIdx = progV.findIndex((c) => c.id === selId);
    startAtRef.current = { tick: selIdx >= 0 ? starts[selIdx] || 0 : 0, idx: selIdx };
    const barMap = useMemo(() => {
      let b = 0;
      return progV.map((c) => {
        const off = b % 16;
        b += SIX(beatsOf(c));
        const over = off + SIX(beatsOf(c)) > 16 && off !== 0;
        return { off, over, beats: beatsOf(c), barStart: off === 0 };
      });
    }, [progV]);
    const suggestions = useMemo(
      () => suggestNext(prog.length ? prog[prog.length - 1] : null, keyPc, mode),
      [prog, keyPc, mode]
    );

    // ── 音訊、播放與排程 ──────────────────────────────────────────────
    // 解鎖 AudioContext、載入取樣、把 progV 交給 buildSchedule 排成
    // Tone.js 的事件，以及播放與停止。

    useEffect(() => {
      let alive = true;
      const eng = new Engine();
      engineRef.current = eng;
      eng.boot((st) => {
        if (alive) setStatus((p) => ({ ...p, ...st }));
      }).then(() => {
        if (!alive) return;
        eng.setVolumes(vols);
        getTransport().bpm.value = bpm;
      });
      return () => {
        alive = false;
      };
    }, []);
    const unlock = useCallback(() => {
      try {
        Tone.start();
      } catch (e) {
      }
    }, []);
    const enterBench = useCallback(() => {
      unlock();
      setBooted(true);
    }, [unlock]);
    useEffect(() => {
      if (engineRef.current) getTransport().bpm.value = bpm;
      setBpmText(String(bpm));
    }, [bpm]);
    useEffect(() => {
      if (!engineRef.current) return;
      const T = getTransport();
      T.swingSubdivision = "8n";
      T.swing = swing;
    }, [swing]);
    const commitBpm = () => {
      const n = parseInt(bpmText, 10);
      if (isNaN(n)) { setBpmText(String(bpm)); return; }
      setBpm(Math.min(220, Math.max(40, n)));
    };
    useEffect(() => {
      if (engineRef.current && engineRef.current.ready) engineRef.current.setVolumes(vols);
    }, [vols]);
    useEffect(() => {
      const eng = engineRef.current;
      if (eng && eng.ready && eng.setClickVol) eng.setClickVol(metroVol);
    }, [metroVol, booted]);
    // 停播或關掉節拍器時把燈熄掉，不然會停在最後亮的那一格看起來像當掉
    useEffect(() => {
      if (!playing || !metro) setMetroTick(-1);
    }, [playing, metro]);
    useEffect(() => {
      const eng = engineRef.current;
      if (eng && eng.ready && eng.setMaster) eng.setMaster(master);
    }, [master, booted]);
    useEffect(() => {
      const eng = engineRef.current;
      if (eng && eng.ready && eng.setMix) eng.setMix(autoMix);
    }, [autoMix, booted]);
    const fireSweep = useCallback((dir, spread, strings) => {
      sweepId.current += 1;
      setSweep({ id: sweepId.current, dir, spread, strings });
    }, []);
    useEffect(() => {
      const eng = engineRef.current;
      if (!eng || !eng.ready) return;
      const T = getTransport();
      if (partRef.current) {
        partRef.current.dispose();
        partRef.current = null;
      }
      if (!progV.length) {
        T.stop();
        setPlaying(false);
        return;
      }
      const { events, totalBars: totalBars2 } = buildSchedule(progV, {
        strumKey,
        drumKey,
        bassKey,
        capo,
        pianoKey,
        useGuitar: on.guitar,
        usePiano: on.piano,
        useBass: on.bass,
        useDrum: on.drum,
        useClick: metro,
        metroDiv,
        metroPat
      });
      const part = new Tone.Part((time, ev) => {
        if (ev.kind === "strum") {
          if (ev.dead) {
            eng.deadStroke(time, ev.vel, ev.strings);
          } else {
            eng.strum(ev.voicing, {
              time, dir: ev.dir, vel: ev.vel, chordChange: ev.chordChange,
              strings: ev.strings, mute: ev.mute, ghost: ev.ghost,
              acc: ev.acc, spreadMs: ev.spreadMs, ring: ev.ring
            });
          }
          getDraw().schedule(() => fireSweep(ev.dir, 0.02, ev.strings || null), time);
        } else if (ev.kind === "pick") {
          eng.pick(ev.voicing, ev.strings ? ev.strings[0] : 0, time, ev.vel);
          getDraw().schedule(() => fireSweep("P", 0, ev.strings), time);
        } else if (ev.kind === "piano") {
          eng.playPiano(ev.notes, time, ev.dur, ev.vel);
        } else if (ev.kind === "bass") {
          eng.playBass(ev.midi, time, ev.dur, ev.vel);
        } else if (ev.kind === "drum") {
          eng.playDrum(ev.drum, time, ev.vel);
          if (ev.duck) eng.duck(time, ev.vel);
        } else if (ev.kind === "click") {
          eng.playClick(ev.level, time);
          // 燈號只在面板開著時才更新——三十二分一小節有 32 個點，面板收起來
          // 時每小節多 32 次 render 是白花的
          if (metroOpenRef.current) getDraw().schedule(() => setMetroTick(ev.tick), time);
        } else if (ev.kind === "mark") {
          getDraw().schedule(() => setCurIdx(ev.chordIdx), time);
        }
      }, events);
      part.loop = true;
      part.loopStart = 0;
      part.loopEnd = totalBars2 + "m";
      part.start(0);
      T.loop = false;
      partRef.current = part;
      return () => {
        if (partRef.current === part) partRef.current = null;
        try { part.dispose(); } catch (e) {}
      };
    }, [booted, engineRef.current && engineRef.current.ready, progV, strumKey, drumKey, bassKey, pianoKey, capo, on, metro, metroDiv, metroPat, fireSweep]);
    const togglePlay = useCallback(async () => {
      if (!engineRef.current || !engineRef.current.ready) return;
      const T = getTransport();
      if (T.state === "started") {
        T.stop();
        engineRef.current.releaseAll(Tone.now());
        setPlaying(false);
        setCurIdx(-1);
      } else {
        await Tone.start();
        const sa = startAtRef.current || { tick: 0, idx: -1 };
        const st = sa.tick || 0;
        T.position = `${Math.floor(st / 16)}:${Math.floor(st % 16 / 4)}:${st % 4}`;
        T.start();
        setCurIdx(sa.idx >= 0 ? sa.idx : -1);
        setPlaying(true);
      }
    }, []);
    useEffect(() => {
      const onKey = (e) => {
        if (e.target && ["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) return;
        if (e.target && e.target.isContentEditable) return;
        if ((e.metaKey || e.ctrlKey) && e.key && e.key.toLowerCase() === "z") {
          e.preventDefault();
          if (e.shiftKey) redo(); else undo();
          return;
        }
        if ((e.metaKey || e.ctrlKey) && e.key && e.key.toLowerCase() === "y") {
          e.preventDefault();
          redo();
          return;
        }
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (document.querySelector(".pick-menu, .exp-menu")) return;
        if (e.code === "Space") {
          e.preventDefault();
          togglePlay();
          return;
        }
        if (e.key >= "1" && e.key <= "9" && !e.shiftKey) {
          const s = suggestions[+e.key - 1];
          if (s) {
            e.preventDefault();
            addChord(s.rootPc, s.quality);
          }
          return;
        }
        if (!progV.length) return;
        const i = progV.findIndex((c) => c.id === selId);
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault();
          const d = e.key === "ArrowLeft" ? -1 : 1;
          const ni = i < 0
            ? (d < 0 ? progV.length - 1 : 0)
            : Math.min(progV.length - 1, Math.max(0, i + d));
          setSelId(progV[ni].id);
          return;
        }
        if (e.key === "Delete" || e.key === "Backspace") {
          if (i < 0) return;
          e.preventDefault();
          removeChordAt(i);
          return;
        }
      };
      window.addEventListener("keydown", onKey);
      return () => window.removeEventListener("keydown", onKey);
    }, [togglePlay, progV, selId, undo, redo, suggestions]);
