<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Chord Lab</title>
<meta name="description" content="自由組裝和弦進行、真實吉他刷弦音色、指板總覽與即興 Pad 的編曲工具。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;600;700&family=LXGW+WenKai+TC&display=swap" />
<style>
*{box-sizing:border-box}
/* 全站隱藏原生捲軸，但保留捲動 */
html,body,*{scrollbar-width:none !important;-ms-overflow-style:none !important}
*::-webkit-scrollbar,*::-webkit-scrollbar-track,*::-webkit-scrollbar-thumb,
*::-webkit-scrollbar-corner{display:none !important;width:0 !important;height:0 !important;
  background:transparent !important}
html,body{margin:0;padding:0;height:100%;background:#0B0C0E}
#root{height:100%}

.cl-root{
  --bg:#0B0C0E; --panel:#13151A; --panel2:#1A1D24; --line:#2A2E37;
  --txt:#EEF0F4; --dim:#868C98; --brass:#8B8CFF; --brass2:#454A85;
  --jade:#4FE3B0; --rust:#FF5F6D; --wood:#121419; --bone:#E8EAEE;
  --string:#B6BCC7; --dot:#2A2E38;
  --fret:#7D828C;
  /* 和弦進行區：綠板與便利貼。這一區刻意跳出深色系，是實體物件的隱喻 */
  --board:#2E4A3E; --board2:#274136; --board-edge:#1B2E26; --board-rule:#3A5A4C;
  --note:#F5E17F; --note2:#EFD86A; --ink:#2E2A1E; --ink-dim:#6B6248;
  --hand:"Caveat","LXGW WenKai TC","Klee One",var(--serif);
  --display:"Syne","Space Grotesk",system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;
  --sans:"Space Grotesk",system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --serif:"Instrument Serif","Songti TC",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  position:fixed; inset:0; height:100dvh;
  display:grid; grid-template-rows:auto minmax(0,1fr) auto;
  background:var(--bg); color:var(--txt); font-family:var(--sans); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.cl-root,.lp{-webkit-user-select:none;-moz-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cl-root input,.cl-root textarea,.cl-root [contenteditable],
.lp input,.lp textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text;
  -webkit-touch-callout:default}
.cl-root button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cl-root svg,.lp svg{-webkit-user-select:none;user-select:none;pointer-events:auto}
.cl-root button:focus-visible,.cl-root input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* 列 */
.bar{display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);position:relative;z-index:20}
.top{height:60px;border-bottom:1px solid var(--line);z-index:50}
.spacer{flex:1}
.brand{display:flex;flex-direction:column;line-height:1.15;padding-right:10px;border-right:1px solid var(--line)}
.brand-name{font-family:var(--serif);font-size:21px;letter-spacing:.16em}
.brand-sub{font-size:10px;color:var(--dim);letter-spacing:.22em}
.ctl-group{display:flex;align-items:center;gap:7px;min-width:0}
.ctl-group.grow{flex:1;min-width:0}
.lbl{font-size:10px;color:var(--dim);letter-spacing:.14em;white-space:nowrap}

/* 自訂下拉 */
.pick{position:relative;flex-shrink:1;min-width:84px}
.pick.grow{flex:1;min-width:0}
.pick.sm .pick-btn{height:24px;padding:0 8px;font-size:10.5px}
.pick-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;
  font-size:12.5px;color:var(--txt);text-align:left;transition:.12s}
.pick-btn:hover{border-color:var(--brass2)}
.pick-btn.open{border-color:var(--brass);background:#232730}
.pick-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-caret{color:var(--dim);flex-shrink:0;transition:transform .15s}
.pick-btn.open .pick-caret{transform:rotate(180deg);color:var(--brass)}
.pick.key .pick-val{font-family:var(--serif);font-size:15px}
.pick-menu{position:fixed;max-width:340px;overflow-y:auto;overscroll-behavior:contain;
  background:#181B22;border:1px solid var(--brass2);border-radius:9px;
  padding:5px;z-index:200;box-shadow:0 16px 40px -12px #000,0 0 0 1px #0006;
  animation:popIn .13s ease-out}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pick-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;
  padding:7px 10px;border-radius:6px;text-align:left;line-height:1.35}
.pick-item:hover{background:#232730}
.pick-item.on{background:var(--brass);color:#080B12}
.pi-l{font-size:13px}
.pi-s{font-size:10.5px;color:var(--dim)}
.pick-item.on .pi-s{color:#2A2C63}
.pick-item.on .pi-l{font-weight:700}

.stepper{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px}
.stepper button{width:24px;height:28px;color:var(--dim);font-size:14px}
.stepper button:hover{color:var(--brass)}
.stepper .num{font-family:var(--mono);font-size:12.5px;min-width:46px;text-align:center;color:var(--brass)}
.stepper input.num{background:none;border:none;outline:none;padding:0;width:46px}
.stepper.sm button{height:24px;width:20px}
.stepper.sm .num{font-size:11px;min-width:52px}

.btn-primary{background:var(--brass);color:#080B12;font-weight:700;border-radius:7px;padding:9px 18px;font-size:13.5px}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary.playing{background:var(--jade)}
.btn-primary.big{padding:13px 34px;font-size:15px;border-radius:9px}
.btn-primary:disabled{opacity:.45;cursor:default}
.btn-ghost{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:8px 12px;font-size:12px;color:var(--dim)}
.btn-ghost:hover{color:var(--brass);border-color:var(--brass2)}
.btn-ghost.sm{padding:6px 10px;font-size:11.5px}
.btn-ghost.wide{width:100%;padding:9px}
.btn-ghost.on{color:var(--jade);border-color:var(--jade)}
.btn-ghost.danger:hover{color:var(--rust);border-color:var(--rust)}
.btn-rec{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-size:12px;color:var(--dim)}
.btn-rec .dot{width:8px;height:8px;border-radius:50%;background:var(--rust);opacity:.55}
.btn-rec.on{color:var(--rust);border-color:var(--rust)}
.btn-rec.on .dot{opacity:1;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.btn-neck{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:7px;
  border:1px solid var(--brass2);color:var(--brass);font-size:11px;line-height:1;background:#161920;
  white-space:nowrap;flex-shrink:0;
  transition:background .14s,color .14s,border-color .14s}
.btn-neck svg{flex-shrink:0}
.btn-neck:hover{background:#1F232C;border-color:var(--brass)}
.btn-neck.on{background:var(--brass);color:#080B12;border-color:var(--brass)}

.chip{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:5px 8px;font-size:11.5px;color:var(--dim)}
.chip.src{display:flex;align-items:center;gap:6px;font-size:10.5px;padding:6px 9px}
.chip.src .led{width:7px;height:7px;border-radius:50%;background:var(--brass)}
.chip.src.ok .led{background:var(--jade)}
.chip.src.warn .led{background:var(--brass);animation:blink 1.4s infinite}

.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:4px 9px;font-size:10.5px;color:var(--dim);background:var(--panel2)}
.seg button.on{background:var(--brass);color:#080B12;font-weight:700}
.seg button:disabled{opacity:.38;cursor:not-allowed}

/* 三欄 */
.mid{display:grid;grid-template-columns:272px minmax(0,1fr) 320px;min-height:0}
.col{display:flex;flex-direction:column;gap:9px;padding:12px 14px;min-height:0;min-width:0}
.left{border-right:1px solid var(--line);background:#0E1014;overflow-y:auto}
.right{border-left:1px solid var(--line);background:#0E1014;overflow-y:auto}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.col-head h2{font-size:12px;letter-spacing:.16em;color:var(--dim);margin:0;font-weight:600;text-transform:uppercase}
.live-tag{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.16em;
  color:var(--jade);border:1px solid var(--jade);border-radius:99px;padding:1px 8px;white-space:nowrap}
.live-tag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--jade);
  animation:live-blip 1.1s ease-in-out infinite}
@keyframes live-blip{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.72)}}
.head-actions{display:flex;gap:6px;align-items:center}
.bars-badge{font-family:var(--mono);color:var(--brass);margin-left:10px;font-size:11px;letter-spacing:0}
.sub-head{font-size:10.5px;letter-spacing:.14em;color:var(--dim);margin-top:2px;display:flex;gap:8px;align-items:baseline}
.sub-head i{opacity:.55;font-style:normal;letter-spacing:0;font-size:10px}

/* 和弦盤 */
.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.12s}
.pad:hover{border-color:var(--brass);background:#232730;transform:translateY(-1px)}
.pad:active{transform:translateY(1px)}
.pad-deg{font-family:var(--mono);font-size:11px;color:var(--brass)}
.pad-name{font-family:var(--serif);font-size:15px}
.spice{display:flex;flex-wrap:wrap;gap:5px}
.spice-chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.25}
.spice-chip em{font-style:normal;font-size:9px;opacity:.65}
.spice-chip:hover{border-color:var(--brass);color:var(--txt)}

/* 範本清單 */
.genre-count{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.tmpl-mode{font-style:normal;font-size:9px;margin-left:5px;padding:0 5px;border-radius:99px;
  border:1px solid var(--line);color:var(--dim);vertical-align:1px}
.tmpl-meta{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);opacity:.72;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmpl-wrap{position:relative;flex:1;min-height:60px;border:1px solid var(--line);
  border-radius:8px;background:#0B0D11;overflow:hidden}
.tmpl-wrap::after{content:"";position:absolute;left:1px;right:1px;bottom:0;height:26px;pointer-events:none;
  background:linear-gradient(to top,#0B0D11 12%,rgba(10,14,22,0))}
.tmpl-list{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:3px;padding:4px 4px 14px}
.tmpl-row{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 8px;
  border-radius:6px;text-align:left;line-height:1.3;transition:.1s}
.tmpl-row:hover{background:#1E222A}
.tmpl-name{font-size:12.5px}
.tmpl-sub{font-size:9.5px;color:var(--dim)}
.tmpl-row:hover .tmpl-name{color:var(--brass)}

/* 進行軌 */
/* ── 和弦進行：綠板與便利貼 ────────────────────────────────────────────
 * 這一區是實體物件的隱喻——一塊綠板，上面貼著一張張便利貼。
 * 板面用漸層做出中間亮四周暗，再加一圈內陰影當板框；淡橫線讓平面不要太空。
 * ──────────────────────────────────────────────────────────────────── */
.track{position:relative;display:flex;flex-wrap:wrap;gap:13px;align-content:flex-start;flex:1;
  min-height:150px;overflow-y:auto;padding:18px 16px;border-radius:8px;
  background:radial-gradient(120% 90% at 50% 0%, var(--board) 0%, var(--board2) 70%, var(--board-edge) 100%);
  box-shadow:inset 0 0 0 1px var(--board-edge), inset 0 2px 14px rgba(0,0,0,.35)}
.track::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;
  background:repeating-linear-gradient(to bottom, transparent 0 33px,
    color-mix(in srgb,var(--board-rule) 26%,transparent) 33px 34px);
  opacity:.5}
.track>*{position:relative}
/* 便利貼本體。角度與紙色照索引輪流套，不用亂數——亂數會讓卡片在每次
   重畫時抖動。右下角折起一小塊當撕口。 */
.card{position:relative;width:116px;min-height:108px;touch-action:none;
  border:0;border-radius:2px;padding:9px 10px 11px;
  display:flex;flex-direction:column;justify-content:space-between;
  color:var(--ink);font-family:var(--hand);
  cursor:pointer;transition:transform .18s ease,box-shadow .14s,filter .14s;
  box-shadow:0 1px 1px rgba(0,0,0,.28), 0 6px 12px -6px rgba(0,0,0,.5);
  transform-origin:50% 8%}
/* 角度與紙色由 JS 依 c.id 指定成變數，不用 nth-child——拖曳時排列順序
   一直在變，靠位置決定的話便利貼會在補位途中忽然換角度換顏色。
   平移量也走變數，FLIP 才不會把旋轉覆寫掉。 */
.card{--rot:0deg;--fx:0px;--fy:0px;background:var(--paper,var(--note));
  transform:translate(var(--fx),var(--fy)) rotate(var(--rot))}
.card.no-anim{transition:none}
/* 空出來的位置。虛線框讓你看得到它要落在哪 */
/* 空位不畫框線，只用一塊比板面再暗一點的區域暗示，看起來像便利貼剛撕走
   留下的痕跡 */
.card-gap{width:116px;min-height:108px;border-radius:2px;flex:0 0 auto;
  background:rgba(0,0,0,.13);transition:transform .18s ease}
/* 拿起來那張：脫離版面跟著游標，傾斜再大一點、影子拉遠，像離開板面 */
.card.ghost{position:fixed;z-index:400;pointer-events:none;margin:0;
  --rot:-4deg;transform:rotate(var(--rot)) scale(1.06);
  box-shadow:0 10px 12px -6px rgba(0,0,0,.5), 0 34px 46px -18px rgba(0,0,0,.85);
  transition:none;filter:brightness(1.06)}
.card::after{content:"";position:absolute;right:0;bottom:0;width:14px;height:14px;
  background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.15) 50%)}
.card:hover{filter:brightness(1.05);box-shadow:0 2px 3px rgba(0,0,0,.3), 0 12px 20px -8px rgba(0,0,0,.6)}
.card:hover{transform:translate(var(--fx),var(--fy)) rotate(var(--rot)) translateY(-3px)}
/* 選取＝被拿起來：擺正、放大、影子拉長 */
.card.sel,.card.sel:hover{transform:translate(var(--fx),var(--fy)) translateY(-4px) scale(1.04);
  box-shadow:0 3px 4px rgba(0,0,0,.3), 0 18px 26px -10px rgba(0,0,0,.7), 0 0 0 2px var(--ink) inset}
.card.live,.card.live:hover{transform:translate(var(--fx),var(--fy)) translateY(-5px) scale(1.06);
  box-shadow:0 3px 4px rgba(0,0,0,.3), 0 20px 30px -10px rgba(0,0,0,.7),
             0 0 0 2px #1E7A5A inset, 0 0 22px -4px var(--jade)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.card-top-r{display:flex;align-items:center;gap:3px;flex-shrink:0}
.card-del{width:19px;height:19px;border-radius:50%;color:var(--ink-dim);font-size:11px;line-height:1;
  display:flex;align-items:center;justify-content:center;border:1px solid transparent;transition:.12s}
.card-del:hover{color:#fff;border-color:transparent;background:var(--rust)}
.card.sel .card-del{color:var(--ink-dim)}
.deg{font-family:var(--mono);font-size:12px;color:var(--brass)}
.card .deg{color:var(--ink);font-family:var(--hand);font-size:16px;font-weight:700;letter-spacing:.01em}
.card.live .deg{color:#14603F}
.card-bars{font-family:var(--hand);font-size:12px;font-weight:600;color:var(--ink-dim);
  border:1px solid color-mix(in srgb,var(--ink) 26%,transparent);border-radius:9px;padding:0 5px;
  white-space:nowrap}
.card-name{font-family:var(--hand);font-weight:700;font-size:31px;line-height:1;padding:3px 0 1px;
  color:var(--ink);letter-spacing:.005em}
/* 小節起點：左上角貼一小條膠帶，比一條邊線更像實體 */
.card.barline::before{content:"";position:absolute;left:-5px;top:9px;width:22px;height:11px;
  background:color-mix(in srgb,#FFFFFF 62%,transparent);transform:rotate(-38deg);
  box-shadow:0 1px 2px rgba(0,0,0,.22)}
.card.over{box-shadow:0 1px 1px rgba(0,0,0,.28), 0 6px 12px -6px rgba(0,0,0,.5),
  0 0 0 2px var(--rust) inset}
.card.over::after{content:"\8d85\51fa\5c0f\7bc0";position:absolute;left:0;right:0;bottom:-13px;text-align:center;
  font-size:8.5px;letter-spacing:.1em;color:var(--rust);pointer-events:none}
.card-len{font-family:var(--hand);font-style:normal;font-weight:600;color:#7A5A1E;margin-left:5px}
.len-btn{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:46px;padding:5px 6px;
  border:1px solid var(--line);border-radius:7px;background:var(--panel2);transition:.12s}
.len-btn span{font-size:14px;line-height:1;color:var(--txt)}
.len-btn i{font-size:9px;font-style:normal;color:var(--dim);white-space:nowrap}
.len-btn:hover{border-color:var(--brass2)}
.len-btn.on{border-color:var(--brass);background:#1D2030}
.len-btn.on span,.len-btn.on i{color:var(--brass)}
.btn-exp{border:1px solid var(--brass2);border-radius:7px;padding:8px 13px;font-size:12px;color:var(--brass);
  white-space:nowrap;transition:.12s}
.btn-exp:hover,.btn-exp.on{background:var(--brass);color:#080B12;border-color:var(--brass);font-weight:600}
.pick.exp{position:relative}
.exp-menu{position:absolute;top:calc(100% + 7px);right:0;min-width:236px;background:#181B22;
  border:1px solid var(--brass2);border-radius:9px;padding:5px;z-index:200;
  box-shadow:0 16px 40px -12px #000;animation:popIn .13s ease-out}
.exp-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;
  padding:7px 10px;border-radius:6px;text-align:left}
.exp-item:hover{background:#232730}
.exp-item b{font-size:12px;font-weight:600;color:var(--txt)}
.exp-item i{font-size:9.5px;font-style:normal;color:var(--dim)}
.card-hint{font-size:12px;font-family:var(--hand);color:var(--ink-dim);letter-spacing:.01em;
  border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent);padding-top:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--dim);font-size:12.5px;line-height:1.8;padding:14px;border:1px dashed var(--line);border-radius:10px;width:100%}
.track .empty{color:color-mix(in srgb,#FFFFFF 72%,transparent);font-family:var(--hand);font-size:16px;
  border-color:color-mix(in srgb,#FFFFFF 26%,transparent);background:transparent}
.empty.tall{margin:auto 0}

/* 右欄・和弦屬性 */
.cprop{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;
  display:flex;flex-direction:column;gap:6px}
.cprop-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cprop-title{font-family:var(--serif);font-size:20px;line-height:1.1}
.cprop-deg{font-family:var(--mono);font-size:11px;color:var(--brass)}
.cprop-live{font-size:9px;letter-spacing:.14em;color:var(--jade);border:1px solid var(--jade);
  border-radius:99px;padding:0 6px}
.cprop-label{font-size:9.5px;letter-spacing:.16em;color:var(--dim);margin-top:3px}
.cprop-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cprop-row.end{justify-content:flex-end;gap:6px;margin-top:2px}
.cprop-keys{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--dim);margin-top:2px}
.cprop-keys kbd{font-family:var(--mono);font-size:9px;color:var(--dim);background:var(--panel2);
  border:1px solid var(--line);border-radius:4px;padding:1px 4px;line-height:1.4}
.mute-row{display:flex;gap:5px}
.mute-btn{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel2);font-size:11px;color:var(--txt);transition:.12s}
.mute-btn b{font-size:9px;color:var(--jade)}
.mute-btn:hover{border-color:var(--brass2)}
.mute-btn.off{border-color:var(--rust);color:var(--dim);background:#241417}
.mute-btn.off b{color:var(--rust)}
.card-mute{font-family:var(--hand);font-style:normal;font-weight:600;color:#A33A3A;margin-right:5px}
.len-row{display:flex;flex-wrap:wrap;gap:4px}
.quals{display:grid;grid-template-columns:auto 1fr;gap:5px 7px;align-items:start}
.qual-grp{font-size:10px;font-weight:600;color:var(--brass2);letter-spacing:.06em;line-height:24px;white-space:nowrap}
.qual-chips{display:flex;flex-wrap:wrap;gap:4px}
.chip.q{font-family:var(--serif);font-size:12.5px;padding:4px 7px}
.chip.q:hover{border-color:var(--brass);color:var(--txt)}
.chip.q.on{background:var(--brass);color:#080B12;border-color:var(--brass);font-weight:600}

/* 推薦 */
.dock{display:flex;flex-direction:column;min-height:0;flex-shrink:0}
.sug{border-top:1px solid var(--line);padding-top:9px}
.sug-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.sug-label{font-size:10.5px;letter-spacing:.16em;color:var(--dim)}
/**
 * 指板總覽的升起與降下。
 *
 * 原本刻意不做動畫，因為 .neck-drawer 是 flex:1——外層 max-height 一動，
 * 它就跟著被壓扁，指板會上下拉扯。
 *
 * 解法是把抽屜改成固定高度、由外層負責裁切：抽屜自己從頭到尾不變形，
 * 外層的 max-height 只決定「露出多少」。再讓抽屜同時往上位移並淡入，
 * 看起來就是從下面升上來，而不是憑空閃出來。
 */
.neck-slot{max-height:0;overflow:hidden;
  display:flex;flex-direction:column;min-height:0;
  margin-top:0;pointer-events:none;
  transition:max-height .38s cubic-bezier(.2,.85,.3,1),
             margin-top .38s cubic-bezier(.2,.85,.3,1)}
.neck-slot > .neck-drawer{flex:0 0 auto;height:min(52vh,400px);
  transform:translateY(18px);opacity:0;
  transition:transform .38s cubic-bezier(.2,.85,.3,1), opacity .26s ease}
.dock.open .neck-slot{max-height:min(52vh,400px);margin-top:9px;pointer-events:auto}
.dock.open .neck-slot > .neck-drawer{transform:translateY(0);opacity:1}
@media (prefers-reduced-motion:reduce){
  .neck-slot,.neck-slot > .neck-drawer{transition:none}
}
.sug-row{display:flex;gap:7px;flex-wrap:wrap}
.sug-chip{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;transition:.12s}
.sug-key{position:absolute;top:-7px;right:-7px;min-width:16px;height:16px;padding:0 4px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9.5px;line-height:1;color:var(--dim);
  background:var(--panel);border:1px solid var(--line);border-radius:5px;
  transition:color .12s,border-color .12s,background .12s}
.sug-chip:hover .sug-key{color:var(--brass);border-color:var(--brass2);background:#1D2030}
.sug-chip.spice:hover .sug-key{color:var(--jade);border-color:var(--jade)}
.sug-chip:hover{border-color:var(--brass);transform:translateY(-1px)}
.sug-chip.spice{border-style:dashed}
.sug-chip.spice:hover{border-color:var(--jade)}
.sug-name{font-family:var(--serif);font-size:16px}
.sug-tag{font-size:9.5px;color:var(--dim)}
.sug-chip.spice .sug-tag{color:var(--jade);opacity:.85}

/* 右欄和弦圖 */
.voice-name{font-family:var(--serif);font-size:26px;display:flex;align-items:baseline;gap:9px}
.voice-name span{font-family:var(--sans);font-size:10.5px;color:var(--dim);letter-spacing:.1em}
/* ── 和弦圖：Pip-Boy 風格的映像管電視 ────────────────────────────────────
 * 白色正方機殼，螢幕裡由上而下是：和弦名與轉位、音程堆疊、和弦按法圖。
 *
 * 機殼包在 .crt 這一層而不是 Fretboard 內部，因為要同時裝下和弦資訊與
 * 和弦圖——資訊本來在電視外面，畫面上下空掉一大塊，看起來不平衡。
 *
 * 螢幕內的配色靠就地覆寫 CSS 變數達成：和弦圖 SVG 裡每個顏色都取自變數，
 * 沒有一個寫死，所以在這一層重新定義就整張變綠，render 不用動。變數只在
 * 這台電視裡生效，App 其他地方不受影響。
 *
 * 改成單色不會丟失資訊：圓點裡本來就有 R／3／5 的文字，音級靠字讀。
 * ──────────────────────────────────────────────────────────────────── */
.crt{
  /* 螢幕內的配色，只在這台電視裡生效 */
  --wood:#06100A; --string:#37FF95; --fret:#1B7A45; --dot:#0D2617;
  --brass:#37FF95; --jade:#C6FFE0; --bone:#37FF95; --rust:#1A6E40; --dim:#23B368;
  position:relative;isolation:isolate;aspect-ratio:1;display:flex;
  background:linear-gradient(#FBFAF7 0%, #EFEDE7 20%, #DCD9D1 62%, #C2BFB6 100%);
  border:1px solid #A7A49B;border-radius:16px;padding:15px 15px 28px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.16),
             0 14px 30px -16px #000, 0 2px 6px -3px rgba(0,0,0,.5)}
/* 螢幕本體。和弦圖用 margin-top:auto 壓到下半部，上方留給資訊 */
.crt-screen{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;
  border-radius:13px/17px;padding:11px 12px 13px;overflow:hidden;
  background:radial-gradient(112% 108% at 50% 42%, #0C1C12 0%, #071109 58%, #040A06 100%);
  box-shadow:inset 0 0 0 2px #020403, inset 0 0 0 3px rgba(55,255,149,.10),
             inset 0 0 34px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.8)}
/* 疊在畫面上的濾鏡層 */
.crt-screen::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  border-radius:13px/17px;
  background:
    linear-gradient(146deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.03) 15%, transparent 32%),
    repeating-linear-gradient(to bottom, rgba(0,0,0,.34) 0 1px, transparent 1px 3px),
    radial-gradient(116% 104% at 50% 40%, rgba(55,255,149,.13) 0%, transparent 50%),
    radial-gradient(122% 112% at 50% 46%, transparent 46%, rgba(0,0,0,.66) 100%)}
/* 螢幕裡的和弦資訊 */
.crt-screen .voice-name{position:relative;z-index:1;display:flex;align-items:baseline;gap:9px;
  font-family:var(--serif);font-size:30px;line-height:1;color:#37FF95;
  text-shadow:0 0 7px rgba(55,255,149,.55);margin:0}
.crt-screen .voice-name span{font-family:var(--mono);font-size:9px;letter-spacing:.15em;
  color:#23B368;text-shadow:0 0 5px rgba(55,255,149,.35);white-space:nowrap}
.crt-screen .voice-stack{position:relative;z-index:1;font-family:var(--mono);font-size:11px;
  letter-spacing:.13em;color:#23B368;text-shadow:0 0 5px rgba(55,255,149,.3);
  margin:5px 0 0;padding-bottom:8px;
  border-bottom:1px solid rgba(55,255,149,.22)}
/* 和弦圖擺在剩餘空間的正中間——直接 margin-top:auto 會把它壓到最底，
   中間反而空一大塊，上下留白平均才是平衡的 */
.crt-screen .fb-wrap{position:relative;z-index:1;margin:auto 0;padding:0;
  background:none;border:0;box-shadow:none;aspect-ratio:auto}
.fb{width:100%;height:auto;display:block;
  filter:saturate(1.2) contrast(1.06)
         drop-shadow(0 0 2px rgba(55,255,149,.5))
         drop-shadow(.5px 0 0 rgba(255,70,90,.18)) drop-shadow(-.5px 0 0 rgba(0,200,255,.18))}
/* 圓點裡的品數字壓在亮綠底上，要用螢幕底色才讀得到 */
.crt .fb-fnum{fill:#06100A}
/* 下緣的喇叭網與品牌字 */
.crt::after{content:"CHORD LAB";position:absolute;left:15px;right:15px;bottom:7px;height:15px;
  display:flex;align-items:center;justify-content:center;letter-spacing:.34em;
  font-family:var(--mono);font-size:7.5px;color:#8B887F;pointer-events:none;
  background:repeating-linear-gradient(to right, rgba(0,0,0,.07) 0 1px, transparent 1px 4px);
  border-radius:2px;text-indent:.34em}
.fb-mark{fill:var(--dim);font-size:11px;text-anchor:middle}
.fb-fnum{fill:#080B12;font-size:9.5px;text-anchor:middle;font-family:var(--mono);font-weight:700}
.fb-pos{fill:var(--dim);font-size:9.5px;text-anchor:middle;font-family:var(--mono)}
.fb-glow{opacity:0;animation:strumGlow .5s ease-out forwards}
@keyframes strumGlow{0%{opacity:0;stroke-width:1}10%{opacity:.95;stroke-width:5}100%{opacity:0;stroke-width:2}}
.voice-stack{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em;margin-top:-2px}
.win-label{font-size:9.5px;color:var(--dim);letter-spacing:.16em;margin-top:2px}
.win-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.win-btn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel2);transition:.12s}
.win-btn b{font-size:10.5px;font-weight:600;color:var(--txt)}
.win-btn i{font-family:var(--mono);font-size:9px;font-style:normal;color:var(--dim);letter-spacing:.02em}
.win-btn:hover{border-color:var(--brass2)}
.win-btn.on{border-color:var(--brass);background:#1D2030}
.win-btn.on b{color:var(--brass)}
.win-btn.weak{opacity:.45}
.seg.tiny.pat{margin-left:2px;overflow-x:auto;overflow-y:hidden;max-width:230px;scrollbar-width:thin;scroll-behavior:smooth}
.seg.tiny.pat::-webkit-scrollbar{height:3px}
.seg.tiny.pat::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.seg.tiny.pat button{min-width:22px;flex:0 0 auto}
/* 第二輪（高八度）從這裡開始，給一條分隔線，免得 1234567123 看不出斷點 */
.seg.tiny.pat button.octstart{box-shadow:inset 1px 0 0 var(--line)}
.seg.tiny.pat button.oct{opacity:.82}
.seg.tiny.pat button.oct.on{opacity:1}
.capo-key{margin-left:6px;font-family:var(--mono);font-size:10.5px;color:var(--brass);
  border:1px solid var(--brass2);border-radius:99px;padding:2px 8px;white-space:nowrap}
.mods{display:flex;flex-wrap:wrap;gap:4px}
.mod{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.mod.add{border-color:var(--jade);color:var(--jade)}
.mod.drop{border-color:var(--rust);color:var(--rust)}
.mod.reset{margin-left:auto;border-style:dashed}
.voice-nav{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--dim)}
.voice-nav button{width:26px;height:24px;border:1px solid var(--line);border-radius:5px}
.voice-nav button:hover{color:var(--brass);border-color:var(--brass2)}
.voice-nav span{display:flex;flex-direction:column;align-items:center;line-height:1.3}
.voice-nav em{font-style:normal;font-family:var(--mono);font-size:9.5px;opacity:.65}
.notes{display:flex;flex-wrap:wrap;gap:4px}
.note-pill{font-family:var(--serif);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 7px}
.note-pill em{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--dim);margin-left:2px}

/* 指板總覽 */
.neck-wrap{display:flex;flex-direction:column;gap:11px;flex:1;min-height:0;overflow-y:auto}
.neck{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.nk-fnum{fill:var(--dim);font-size:11px;text-anchor:middle;font-family:var(--mono)}
.nk-scale{fill:var(--brass);opacity:.16;cursor:pointer;transition:opacity .12s}
.nk-scale:hover{opacity:.75;r:5}
.nk-dot{cursor:pointer;opacity:.24;transition:opacity .12s}
.nk-dot.active{opacity:1}
.nk-dot:hover{opacity:.85}
.nk-dot.active:hover{opacity:1}
.nd-head .pick{flex-shrink:0}
.nk-hit{fill:transparent;cursor:pointer}
.nk-hit:hover{fill:#4C8FD433}
.nk-dot.chrom circle{fill:#0E1F33;stroke:#4C8FD4;stroke-width:1.6}
.nk-dot.chrom text{fill:#8CC0F0}
.nk-dot.outside circle{fill:#171A20;stroke:#4C525E;stroke-width:1.2}
.nk-dot.outside text{fill:var(--dim)}
.nk-dot.manual circle{stroke:var(--jade);stroke-width:2.2}
.nk-dot.cut{opacity:.5}
/* 實色模式：把平常半透明的音點打亮，方便看整個把位的形狀 */
.nk-dot.lit,.nk-dot.lit:hover{opacity:1}
.nk-dot.cut circle{stroke:var(--rust);stroke-width:1.6;stroke-dasharray:2.5 2}
.nk-dot text{font-size:9.5px;text-anchor:middle;font-family:var(--mono);font-weight:700;pointer-events:none}
.nk-dot.root circle{fill:var(--brass);stroke:none}
.nk-dot.root text{fill:#080B12}
.nk-dot.third circle{fill:var(--jade);stroke:none}
.nk-dot.third text{fill:#04261C}
.nk-dot.fifth circle{fill:#232830;stroke:var(--brass);stroke-width:1.4}
.nk-dot.fifth text{fill:var(--brass)}
.nk-dot.ext circle{fill:#14171D;stroke:var(--dim);stroke-width:1.3}
.nk-dot.ext text{fill:var(--txt)}
.nk-dot:hover circle{filter:brightness(1.25)}
.nk-ring{fill:none;stroke:var(--jade);stroke-width:2}
.brk-body{fill:#8B8CFF0E;stroke:var(--brass);stroke-width:1.4;opacity:.85;pointer-events:none}
.brk-bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.brk-lbl{font-size:9.5px;letter-spacing:.16em;color:var(--dim);margin-right:2px}
.brk-btn{display:flex;align-items:baseline;gap:5px;padding:4px 9px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel2);transition:.12s;white-space:nowrap}
.brk-btn b{font-size:11px;font-weight:600;color:var(--txt)}
.brk-btn i{font-family:var(--mono);font-size:9px;font-style:normal;color:var(--dim)}
.brk-btn:hover{border-color:var(--brass2)}
.brk-btn.on{background:var(--brass);border-color:var(--brass)}
.brk-btn.on b{color:#080B12;font-weight:700}
.brk-btn.on i{color:#080B12;opacity:.7}
.neck-legend{display:flex;flex-wrap:wrap;gap:7px 12px;align-items:center;font-size:10.5px;color:var(--dim)}
.lg{display:inline-flex;flex-flow:row nowrap;align-items:center;gap:5px;white-space:nowrap;
  flex:0 0 auto;line-height:1.4}
.lg::before{content:"";display:block;box-sizing:border-box;width:11px;height:11px;border-radius:50%;
  flex:0 0 11px;align-self:center}
.lg.root::before{background:var(--brass)}
.lg.third::before{background:var(--jade)}
.lg.fifth::before{background:#232830;border:1.4px solid var(--brass)}
.lg.ext::before{background:#14171D;border:1.3px solid var(--dim)}
.lg.chrom::before{background:#0E1F33;border:1.5px solid #4C8FD4}
.lg.sc::before{display:none;}
.lg.sc{padding-left:0}

/* 混音 */
.rack{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--line)}
.rack .ctl-group{flex-direction:column;align-items:stretch;gap:4px;min-width:0}
.rack .ctl-group.grow{flex:none}
.rack .lbl{font-size:9.5px;letter-spacing:.16em}
.rack .pick{width:100%}
.rack .pick .pick-btn{width:100%;height:30px}
.rack > .btn-ghost.sm{align-self:flex-start}
.prev-row{display:flex;align-items:center;gap:8px;padding-top:9px;margin-top:2px;
  border-top:1px solid var(--line)}
.prev-lbl{font-size:9.5px;letter-spacing:.16em;color:var(--dim);width:76px;flex-shrink:0}
.prev-row .seg{flex:1}
.prev-row .seg button{flex:1;padding:4px 2px}
.mixer{display:flex;flex-direction:column;gap:7px;padding-top:9px;margin-top:2px;
  border-top:1px solid var(--line)}
.mixer .ch{flex-direction:row;align-items:center;gap:8px;width:100%}
.mixer .ch-top{width:76px;flex-shrink:0}
.mixer .ch input[type=range]{flex:1;min-width:0}
.mixer .ch.master{padding-left:0;margin-left:0;border-left:none;
  padding-top:7px;border-top:1px solid var(--line)}
.ch{display:flex;flex-direction:column;gap:3px;width:86px}
.ch-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.ch-val{font-family:var(--mono);font-size:9.5px;color:var(--dim);flex-shrink:0;
  font-variant-numeric:tabular-nums}
.ch.master{padding-left:10px;margin-left:2px;border-left:1px solid var(--line)}
.ch.master .ch-name{color:var(--brass);cursor:default}
.ch.master input[type=range]{accent-color:var(--brass)}
.ch.off{opacity:.38}
.ch-name{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--txt)}
.ch-led{width:6px;height:6px;border-radius:50%;display:inline-block}
.ch-led.s{background:var(--jade)}
.ch-led.l{background:var(--brass);animation:blink 1.2s infinite}
.ch-led.y{background:var(--brass2)}
.ch input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:var(--line);outline:none}
.ch input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--brass);cursor:pointer}
.ch input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--brass);cursor:pointer}

.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#181B22;
  border:1px solid var(--brass2);color:var(--txt);padding:9px 18px;border-radius:8px;font-size:12.5px;z-index:90}

@media (max-width:1180px){
  .mid{grid-template-columns:236px minmax(0,1fr) 292px}

}

/* ── 左欄調性 ── */

.cl-root .btn-metro-more{padding:0 6px;margin-left:-1px;border:1px solid var(--line);border-left:0;
  border-radius:0 7px 7px 0;background:var(--panel2);color:var(--dim);font-size:10px}
.btn-metro-more.on{color:var(--brass);border-color:var(--brass2)}
.metro-panel{position:absolute;top:calc(100% + 7px);right:0;width:288px;background:#181B22;

/* 拍點方塊。lv3 重音、lv2 次重音、lv1 一般、lv0 靜音；lit 是現在響到的那一格 */
/* 底色要比面板底(#181B22)亮得夠多，不然「一般」那格會跟背景糊在一起，

<script>
window.__CHORDLAB__ = function(){

   *     8  音訊引擎              Engine 類別

   *    11  律動與排程            buildSchedule

   * 加升降——升記號模式往下借、降記號模式往上借，才不會寫出跳字母的怪名字。

    const scale = scaleOf(mode);

    if (lastChord) {
      const rel = ((lastChord.rootPc - keyPc) % 12 + 12) % 12;
      const i = scale.indexOf(rel);
      degIdx = i >= 0 ? i : 0;
    }
    (TRANSITIONS[degIdx] || TRANSITIONS[0]).forEach(([d, w, tag]) => {

        quality: triads[d],

        spice: false

    });
    out.sort((a, b) => b.weight - a.weight);
    const top = out.slice(0, 4);

    picks.forEach(

  }

  // ────────────────────────────────────────────────────────────────────────
  // 6. MIDI 匯出
  // 手刻 MIDI 檔的位元組，沒有外部函式庫。
  // ────────────────────────────────────────────────────────────────────────

  function writeVarLen(n) {
    const bytes = [n & 127];
    n >>= 7;
    while (n > 0) {
      bytes.unshift(n & 127 | 128);
      n >>= 7;
    }
    return bytes;
  }
  function strBytes(s) {
    return Array.from(s).map((c) => c.charCodeAt(0));
  }
  function u32(n) {
    return [n >> 24 & 255, n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  function u16(n) {
    return [n >> 8 & 255, n & 255];
  }
  function buildTrack(noteEvents, ppq, program, channel, name) {
    const evs = [];
    evs.push({ tick: 0, data: [255, 3, name.length, ...strBytes(name)] });
    evs.push({ tick: 0, data: [192 | channel, program] });
    noteEvents.forEach((n) => {
      const on = Math.round(n.beat * ppq);
      const off = Math.round((n.beat + n.dur) * ppq);
      evs.push({ tick: on, data: [144 | channel, n.midi, Math.max(1, Math.min(127, Math.round(n.vel * 127)))] });
      evs.push({ tick: off, data: [128 | channel, n.midi, 0], off: true });
    });
    evs.sort((a, b) => a.tick - b.tick || (a.off ? -1 : 1));
    let last = 0;
    const body = [];
    evs.forEach((e) => {
      body.push(...writeVarLen(e.tick - last), ...e.data);
      last = e.tick;
    });
    body.push(...writeVarLen(0), 255, 47, 0);
    return [...strBytes("MTrk"), ...u32(body.length), ...body];
  }
  function exportMidi(noteTracks, bpm, ppq = 480) {
    const header = [...strBytes("MThd"), ...u32(6), ...u16(1), ...u16(noteTracks.length + 1), ...u16(ppq)];
    const mpqn = Math.round(6e7 / bpm);
    const tempoBody = [
      ...writeVarLen(0),
      255,
      81,
      3,
      mpqn >> 16 & 255,
      mpqn >> 8 & 255,
      mpqn & 255,
      ...writeVarLen(0),
      255,
      88,
      4,
      4,
      2,
      24,
      8,
      ...writeVarLen(0),
      255,
      47,
      0
    ];
    const tempoTrack = [...strBytes("MTrk"), ...u32(tempoBody.length), ...tempoBody];
    const bytes = [...header, ...tempoTrack];
    noteTracks.forEach((t) => bytes.push(...t));
    return new Blob([new Uint8Array(bytes)], { type: "audio/midi" });
  }

  const DRUM_BASES = [

    "A#1": "As1.mp3",
    "C#2": "Cs2.mp3",
    E2: "E2.mp3",

      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), timeoutMs);

        const jobs = [];
        DRUM_PIECES.forEach((kind) => {
          DRUM_KIT[kind].rr.forEach((count, li) => {
            for (let v = 1; v <= count; v++) {

            }
          });
        });

        const kit = {};
        DRUM_PIECES.forEach((kind) => {
          kit[kind] = { layers: DRUM_KIT[kind].rr.map(() => []), last: DRUM_KIT[kind].rr.map(() => -1) };
        });
        jobs.forEach((j, k) => kit[j.kind].layers[j.li].push(bufs[k]));

  /**
   * 取樣音檔的開頭幾乎都有一段靜音（mp3 編碼延遲加上錄音留白），長度從 23ms
   * 到 49ms 不等。鼓是用 Player 播的、開頭 0ms，所以直接播會讓吉他、鋼琴、
   * 貝斯全部聽起來比鼓晚半拍格。解碼後先把這段裁掉，音頭才會對齊。
   */
  function trimLeadingSilence(buf) {
    let peak = 0;
    for (let c = 0; c < buf.numberOfChannels; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
    }
    // 用峰值的 1% 當門檻。絕對門檻會把起音前那段 -60dB 的預備音留著，

    const thr = Math.max(3e-4, peak * 0.01);

    const out = new Array(items.length);
    let next = 0;
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
      while (next < items.length) {
        const i = next++;

      }
    }));

  }

  // ────────────────────────────────────────────────────────────────────────

  class Engine {
