    <p class="csl-wd-year">2025</p>
    <p class="csl-wd-medium">尺寸依場地而定<br>麥克風、磅秤、揚聲器、馬達、電路版</p>
    <p class="csl-wd-statement">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;作品以菜市場磅秤為基底，結合麥克風與馬達裝置，探索聲音與重量的對話。靈感源自市集、市場的喧囂與日常。我將麥克風置於磅秤前接收環境的聲音，馬達牽動磅秤指針，模擬聲音大小轉化為可視的重量，創造「無形」與「有形」的交織。作品試圖讓提醒觀眾重新聆聽日常，思考聲音如何承載我們的生活重量。</p>
